<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Giochi Magici — Pannello Interattivo</title>
<style>
  @import url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css');
  @font-face{
    font-family:'magic';
    src:url('https://dl.dropboxusercontent.com/scl/fi/nbzmrri4qyvc3tzx96911/HarryBeastDisplay-Regular.woff2?rlkey=he290voe32k33gowug23c1osc&st=nj9fgly1') format('woff2');
    font-weight:normal;
    font-style:normal;
    font-display:swap;
  }
  :root{
    --oro:#bfad03;
    --oro-chiaro:#e6d24a;
    --sfondo:#1b1b1b;
    --pannello:#2a2a2a;
    --pannello2:#333333;
    --testo:#eee;
    --viola:#9b59b6;
    --verde:#2ecc71;
    --blu:#3498db;
    --rosso:#e74c3c;
  }
  *{box-sizing:border-box;}

  button{
    font-family:'magic','Palatino Linotype','Book Antiqua',serif;
    letter-spacing:.25px;
  }
  body{
    margin:0;
    background:var(--sfondo);
    color:var(--testo);
    font-family:'Georgia','Cambria',serif;
    line-height:1.5;
  }
  header{
    padding:22px 18px 10px 18px;
    text-align:center;
    border-bottom:2px solid var(--oro);
    background:linear-gradient(180deg,#242018,#1b1b1b);
  }
  header h1{
    margin:0;
    font-family:'magic','Palatino Linotype','Book Antiqua',serif;
    letter-spacing:2px;
    color:var(--oro-chiaro);
    text-shadow:0 0 10px rgba(191,173,3,0.35);
  }
  header p{color:#bbb;font-style:italic;margin:7px 0 0 0;font-size:0.9em;}
  .gm-header-icon{
    width:58px;height:58px;margin:0 auto 10px auto;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    border:2px solid var(--oro);background:#171717;color:var(--oro-chiaro);
    font-size:1.45rem;box-shadow:0 0 0 4px rgba(191,173,3,.08);
  }
  nav{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:center;
    padding:14px 10px;
    background:#161616;
    border-bottom:1px solid #3a3a3a;
    position:sticky;
    top:0;
    z-index:10;
  }
  nav button{
    background:var(--pannello2);
    color:var(--testo);
    border:1px solid #555;
    border-radius:5px;
    padding:8px 12px;
    font-size:0.85em;
    cursor:pointer;
    font-family:'magic','Palatino Linotype','Book Antiqua',serif;
    letter-spacing:.25px;
    transition:background 0.2s, color 0.2s;
  }
  nav button:hover{background:#3f3f3f;}
  nav button.attivo{
    background:var(--oro);
    color:#1b1b1b;
    font-weight:bold;
    border-color:var(--oro-chiaro);
  }
  main{
    max-width:920px;
    margin:0 auto;
    padding:20px 14px 60px 14px;
  }
  section.pannello{
    display:none;
    background:var(--pannello);
    border:1px solid #444;
    border-left:4px solid var(--oro);
    border-radius:6px;
    padding:18px 20px;
    margin-bottom:20px;
  }
  section.pannello.attivo{display:block;}
  section.pannello h2{
    margin-top:0;
    font-family:'magic','Palatino Linotype','Book Antiqua',serif;
    letter-spacing:.6px;
    color:var(--oro-chiaro);
    border-bottom:1px solid #444;
    padding-bottom:8px;
  }
  section.pannello h3{font-family:'magic','Palatino Linotype','Book Antiqua',serif;letter-spacing:.35px;}
  .intro{color:#ccc;font-size:0.92em;margin-bottom:14px;}
  .riquadro{
    background:var(--pannello2);
    border:1px solid #4a4a4a;
    border-radius:5px;
    padding:12px 14px;
    margin-bottom:14px;
  }
  .riga{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;
    margin-bottom:10px;
  }
  .campi-pg{
    display:flex;
    flex-wrap:wrap;
    gap:14px 22px;
    align-items:center;
    margin:12px 0 14px;
  }
  .campo-pg{
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  .luogo-esclusivo{
    color:#e35b5b;
    font-weight:600;
  }
  .luogo-esclusivo b{color:#ff6b6b;}
  .luogo-esclusivo a{color:inherit;text-decoration:underline;text-underline-offset:2px;}
  .luogo-esclusivo a:hover{color:#ff8a8a;}
  label{font-size:0.85em;color:#ccc;}
  input[type=text], input[type=password], input[type=number], select{
    background:#1f1f1f;
    color:var(--testo);
    border:1px solid #555;
    border-radius:4px;
    padding:6px 8px;
    font-family:inherit;
    width:120px;
  }
  input[type=text]{width:150px;}
  .btn{
    background:var(--oro);
    color:#1b1b1b;
    border:none;
    border-radius:4px;
    padding:9px 16px;
    font-weight:bold;
    cursor:pointer;
    font-family:'magic','Palatino Linotype','Book Antiqua',serif;
    letter-spacing:.25px;
    font-size:0.9em;
  }
  .btn:hover{background:var(--oro-chiaro);}
  .btn.secondario{
    background:#555;
    color:var(--testo);
  }
  .btn.secondario:hover{background:#666;}
  .btn:disabled{
    opacity:.32;
    cursor:not-allowed;
    filter:grayscale(.85);
    box-shadow:none;
  }
  .btn:disabled:hover{
    filter:grayscale(.85);
  }
  .btn.piccolo{padding:6px 10px;font-size:0.8em;}
  .azioni{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px;}
  .azioni .btn{margin:0;}
  .btn + .btn{margin-left:8px;}
  .azioni .btn + .btn{margin-left:0;}
  .riquadro p + .btn,.riquadro .nota + .btn{margin-top:10px;}
  .testo-azioni{margin:0 0 10px 0;}
  .riquadro > .nota + .azioni{margin-top:12px;}
  .btn.rimuovi{background:var(--rosso);color:#fff;}
  ul.giocatori{list-style:none;padding:0;margin:8px 0;}
  ul.giocatori li{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#242424;
    border:1px solid #444;
    border-radius:4px;
    padding:6px 10px;
    margin-bottom:5px;
    font-size:0.9em;
  }
  .bb-squadre{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
    margin-bottom:14px;
  }
  .bb-squadra{
    background:#242424;
    border:1px solid #444;
    border-radius:5px;
    padding:12px;
    min-width:0;
  }
  .bb-squadra h3{
    color:var(--oro-chiaro);
    font-family:'magic','Palatino Linotype','Book Antiqua',serif;
    font-size:1em;
    margin:0 0 9px 0;
  }
  .bb-squadra input[type=text]{width:145px;}
  .bb-squadra input[type=number]{width:82px;}
  .bb-contatore{font-size:.78em;color:#aaa;margin:6px 0 9px;}
  .bb-sessioni{display:grid;gap:8px;margin-top:10px;}
  .bb-sessione{background:#242424;border:1px solid #474747;border-radius:5px;padding:10px 12px;}
  .bb-sessione-top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;}
  .bb-sessione-titolo{font-weight:bold;color:var(--oro-chiaro);}
  .bb-sessione-meta{font-size:.8em;color:#aaa;margin-top:4px;}
  .bb-round-box{margin-top:12px;}
  .bb-round-box h3,.bb-riepilogo h3,.bb-salvataggio h3{font-family:'magic','Palatino Linotype','Book Antiqua',serif;color:var(--oro-chiaro);letter-spacing:.4px;}
  .bb-tiri{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0;}
  .bb-tiro-lato{background:#202020;border:1px solid #444;border-radius:5px;padding:10px;}
  .bb-tiro-lato b{color:var(--oro-chiaro);}
  .bb-dado-riga{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(120px,190px);gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed #3f3f3f;}
  .bb-dado-riga:last-child{border-bottom:none;}
  .bb-dado-info{min-width:0;}
  .bb-dado-formula{display:inline-block;color:var(--oro-chiaro);font-weight:bold;margin-left:5px;}
  .bb-dado-risultato{width:100%!important;min-width:120px;}
  .sc-dado-riga{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;}
  .sc-risultati-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:3px;}
  .sc-risultato-label{display:block;font-size:.75em;color:#aaa;}
  .sc-num-vince{color:var(--verde);font-weight:800;}
  .sc-num-perde{color:var(--rosso);font-weight:800;}
  .sc-num-pari{color:var(--oro-chiaro);font-weight:800;}
  .sc-pg-a{color:#6fcfff;font-weight:800;}
  .sc-pg-b{color:#d9a0ff;font-weight:800;}
  .sc-distrugge{color:var(--verde);font-weight:800;border:1px solid rgba(46,204,113,.55);border-radius:5px;padding:1px 5px;}
  .sc-distrugge .sc-pg-a{color:#6fcfff;}
  .sc-distrugge .sc-pg-b{color:#d9a0ff;}
  .sc-risultato-label input{display:block;width:100%!important;min-width:0!important;margin-top:4px;}
  .bb-copia-tutti{margin-top:10px;}
  .bb-esito-parziale{font-size:.8em;color:#aaa;margin-top:8px;}
  @media(max-width:560px){.bb-dado-riga{grid-template-columns:1fr auto}.bb-dado-risultato{grid-column:1/-1;width:100%!important;}}
  .bb-scelta-round{border-top:1px dashed #555;margin-top:12px;padding-top:12px;}
  .bb-riepilogo{margin-top:14px;}
  .bb-riepilogo table td:first-child{text-align:left;}
  .bb-malus-live{font-size:.82em;color:#bbb;margin-top:6px;}
  .bb-sessione-corrente{color:var(--verde);font-weight:bold;}
  @media(max-width:680px){
    .bb-squadre,.bb-tiri{grid-template-columns:1fr;}
  }

  .log{
    max-height:340px;
    overflow-y:auto;
    background:#161616;
    border:1px solid #444;
    border-radius:5px;
    padding:10px 12px;
    margin-top:10px;
  }
  .log .voce{
    border-bottom:1px dashed #3a3a3a;
    padding:6px 0;
    font-size:0.88em;
  }
  .log .voce:last-child{border-bottom:none;}
  .log .voce .esito{color:var(--oro-chiaro);font-weight:bold;}
  .log .voce .vincitore{color:var(--verde);font-weight:bold;}
  .dado{
    display:inline-block;
    background:#111;
    border:1px solid var(--oro);
    color:var(--oro-chiaro);
    border-radius:4px;
    padding:2px 7px;
    margin:0 3px;
    font-weight:bold;
  }
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:0.88em;}
  table th, table td{border:1px solid #444;padding:6px 8px;text-align:center;}
  table th{background:#222;color:var(--oro-chiaro);}
  .tag-viola{color:var(--viola);}
  .tag-verde{color:var(--verde);}
  .tag-blu{color:var(--blu);}
  .tag-rosso{color:var(--rosso);}
  .nota{
    font-size:0.82em;
    color:#999;
    font-style:italic;
    margin-top:8px;
  }
  .carta{
    display:inline-block;
    background:#1f1f1f;
    border:1px solid #666;
    border-radius:4px;
    padding:5px 9px;
    margin:3px;
    font-size:0.85em;
  }
  .sp-btn-viola{background:var(--viola)!important;color:#fff!important;border-color:var(--viola)!important;}
  .sp-btn-verde{background:var(--verde)!important;color:#111!important;border-color:var(--verde)!important;}
  .sp-btn-blu{background:var(--blu)!important;color:#fff!important;border-color:var(--blu)!important;}
  .sp-btn-rosso{background:var(--rosso)!important;color:#fff!important;border-color:var(--rosso)!important;}
  .sp-carta-terra{
    margin-top:12px;
    padding:10px 12px;
    border:1px solid #555;
    border-radius:5px;
    background:#202020;
    font-weight:bold;
  }
  .sp-carta-terra .sp-terra-valore{display:inline-block;margin-left:6px;padding:3px 8px;border-radius:4px;border:1px solid currentColor;}
  .sp-terra-dorata{color:var(--oro-chiaro);}
  .sp-terra-viola{color:var(--viola);}
  .sp-terra-verde{color:var(--verde);}
  .sp-terra-blu{color:var(--blu);}
  .sp-terra-rosso{color:var(--rosso);}
  .tr-carta-calici{border-color:#6fcfff;color:#bfeaff;}
  .tr-carta-galeoni{border-color:var(--oro-chiaro);color:var(--oro-chiaro);}
  .tr-carta-bacchette{border-color:#d9a0ff;color:#e4c4ff;}
  .tr-carta-pugnali{border-color:#ff7474;color:#ff9a9a;}
  .tr-btn-calici{background:#397694!important;color:#fff!important;}
  .tr-btn-galeoni{background:#9b8317!important;color:#fff!important;}
  .tr-btn-bacchette{background:#75518d!important;color:#fff!important;}
  .tr-btn-pugnali{background:#9b3e3e!important;color:#fff!important;}
  .tr-tavolo{margin-top:12px;padding:12px;border:1px solid #555;border-radius:5px;background:#202020;}
  .tr-tavolo .carta{font-size:.95em;font-weight:bold;}
  .tr-score{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;}
  .tr-score > span{padding:5px 9px;border:1px solid #555;border-radius:4px;background:#202020;}
  .sp-carta-ricevuta{
    border:2px solid #f2f2f2!important;
    box-shadow:0 0 0 1px rgba(255,255,255,.18),0 0 8px rgba(255,255,255,.18);
  }
  .sp-carta-ricevuta::after{
    content:'ricevuta';
    display:block;
    margin-top:4px;
    color:#eee;
    font-size:.72em;
    font-style:italic;
  }
  .sp-vittoria-box{
    margin:14px 0 6px;
    padding:18px 16px;
    border:2px solid var(--verde);
    border-radius:7px;
    background:#18231a;
    text-align:center;
    box-shadow:0 0 14px rgba(126,196,118,.18);
  }
  .sp-vittoria-box .sp-vittoria-titolo{
    display:block;
    font-family:'magic','Palatino Linotype','Book Antiqua',serif;
    color:var(--verde);
    font-size:1.65em;
    letter-spacing:.6px;
    margin-bottom:5px;
  }
  .sp-vittoria-box .sp-vittoria-testo{color:#eee;font-weight:bold;}
  .mano{margin:8px 0;}
  .avviso{color:var(--rosso);font-weight:bold;}
  .successo{color:var(--verde);font-weight:bold;}
  footer{
    text-align:center;
    color:#666;
    font-size:0.78em;
    padding:14px;
  }
</style>
</head>
<body>

<header>
  <div class="gm-header-icon" aria-hidden="true"><i class="fa-solid fa-dice"></i></div>
  <h1>Giochi Magici</h1>
  <p>Pannello interattivo per Locande, Hogwarts e dintorni</p>
</header>

<nav id="barra-nav"></nav>

<main id="area-giochi"></main>

<footer>Strumento generato per uso interno al gioco di ruolo — tira, gioca e divertiti comodamente da qui.</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
  import { getFirestore, collection, doc, setDoc, updateDoc, getDoc, getDocs, serverTimestamp, onSnapshot, runTransaction, writeBatch, arrayUnion } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCvd56bSEL02s2OY2PSk7uyFX-CYRB4Vz0",
    authDomain: "conteggi-eee1b.firebaseapp.com",
    projectId: "conteggi-eee1b",
    storageBucket: "conteggi-eee1b.firebasestorage.app",
    messagingSenderId: "481320219586",
    appId: "1:481320219586:web:87e974d618a302adfadc5b"
  };

  /* App Firebase nominata: non interferisce con l'accesso Email/Password
     dell’altro strumento anche se le due pagine sono aperte sullo stesso dominio. */
  const gmApp = initializeApp(firebaseConfig, "giochi-magici");
  const gmAuth = getAuth(gmApp);
  const gmDb = getFirestore(gmApp);

  /* App separata per il Knocker: usa credenziali Nome PG + password della
     singola partita senza sostituire l'accesso anonimo usato dagli altri giochi. */
  const knApp = initializeApp(firebaseConfig, "giochi-magici-knocker-private");
  const knAuth = getAuth(knApp);
  // Sessione Knocker isolata per singola scheda: due tab dello stesso browser
  // possono restare autenticati contemporaneamente con due PG diversi.
  const knAuthReady = setPersistence(knAuth, browserSessionPersistence);
  const knDb = getFirestore(knApp);

  /* App separata anche per Sparaschiocco: stessa architettura privata del
     Knocker, ma credenziali tecniche distinte per non mischiare i due giochi. */
  const spApp = initializeApp(firebaseConfig, "giochi-magici-sparaschiocco-private");
  const spAuth = getAuth(spApp);
  const spAuthReady = setPersistence(spAuth, browserSessionPersistence);
  const spDb = getFirestore(spApp);

  /* App separata per il Trionfo: mani private condivise per lato/coppia,
     accesso Nome PG + password e nessuna Cloud Function. */
  const trApp = initializeApp(firebaseConfig, "giochi-magici-trionfo-private");
  const trAuth = getAuth(trApp);
  const trAuthReady = setPersistence(trAuth, browserSessionPersistence);
  const trDb = getFirestore(trApp);

  function knNormName(value){
    return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ');
  }
  function knHash(value){
    let h=2166136261; const str=String(value||'');
    for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
    return (h>>>0).toString(36);
  }
  function knEmail(sessionId, playerKey){
    return 'knocker.'+String(sessionId).replace(/[^a-zA-Z0-9]/g,'').toLowerCase()+'.'+knHash(playerKey)+'@felix.invalid';
  }
  function knRandomInt(max){
    max=Number(max); if(!Number.isInteger(max)||max<1) throw new Error('Intervallo casuale non valido.');
    const lim=Math.floor(0x100000000/max)*max; const a=new Uint32Array(1); let x;
    do{ crypto.getRandomValues(a); x=a[0]; }while(x>=lim);
    return (x%max)+1;
  }
  function spEmail(sessionId, playerKey){
    return 'sparaschiocco.'+String(sessionId).replace(/[^a-zA-Z0-9]/g,'').toLowerCase()+'.'+knHash(playerKey)+'@felix.invalid';
  }
  const TR_SUITS = ['Calici','Galeoni','Bacchette','Pugnali'];
  function trEmail(sessionId, playerKey){
    return 'trionfo.'+String(sessionId).replace(/[^a-zA-Z0-9]/g,'').toLowerCase()+'.'+knHash(playerKey)+'@felix.invalid';
  }
  function trCardFromId(id){
    id=Number(id);if(!Number.isInteger(id)||id<1||id>12)throw new Error('Carta Trionfo non valida.');
    return {id:id,value:((id-1)%3)+1,suit:TR_SUITS[Math.floor((id-1)/3)]};
  }
  function trCardText(id){const c=trCardFromId(id);return c.value+' di '+c.suit;}
  function trShuffleDeck(){
    const a=[];for(let i=1;i<=12;i++)a.push(i);
    for(let i=a.length-1;i>0;i--){const j=knRandomInt(i+1)-1,t=a[i];a[i]=a[j];a[j]=t;}
    return a;
  }
  function trWinnerSide(leadSide,leadId,responseSide,responseId,trumpSuit){
    const a=trCardFromId(leadId),b=trCardFromId(responseId),at=a.suit===trumpSuit,bt=b.suit===trumpSuit;
    if(at&&bt)return a.value>b.value?leadSide:responseSide;
    if(at)return leadSide;if(bt)return responseSide;
    if(b.suit===a.suit&&b.value>a.value)return responseSide;
    return leadSide;
  }
  function spCardsEach(n){ return n===2?10:(n===3?6:(n===4?5:0)); }
  function spColorFromId(id){
    id=Number(id);
    if(id>=1&&id<=5)return 'Viola';
    if(id>=6&&id<=10)return 'Verde';
    if(id>=11&&id<=15)return 'Blu';
    if(id>=16&&id<=20)return 'Rosso';
    return '';
  }
  function spBeats(cardId,lastCardId){
    if(!lastCardId)return true;
    const c=spColorFromId(cardId),l=spColorFromId(lastCardId);
    return (c==='Verde'&&l==='Viola')||(c==='Viola'&&l==='Blu')||(c==='Blu'&&l==='Rosso')||(c==='Rosso'&&l==='Verde');
  }
  function spPrivateRef(sessionId){
    if(!spAuth.currentUser)throw new Error('Accedi prima come PG.');
    return doc(spDb,'gm_sparaschiocco_partite',String(sessionId),'players',spAuth.currentUser.uid);
  }
  async function spReserveCards(sessionId,count){
    const out=[],candidates=[];for(let i=1;i<=20;i++)candidates.push(i);
    for(let i=candidates.length-1;i>0;i--){const j=knRandomInt(i+1)-1,t=candidates[i];candidates[i]=candidates[j];candidates[j]=t;}
    for(let i=0;i<candidates.length&&out.length<count;i++){
      const n=candidates[i];
      try{await setDoc(doc(spDb,'gm_sparaschiocco_partite',String(sessionId),'cards',String(n)),{used:true,at:serverTimestamp()});out.push(n);}

  function knBetState(players,progress,round){
    const r=round===2?2:1,amountField=r===2?'round2Amount':'round1Amount',actionField=r===2?'round2Action':'round1Action',passedField=r===2?'round2Passed':'round1Passed';
    const rows=[],activeKeys=[]; let highest=0,roundPot=0,totalPot=0,allJoined=true;
    const byKey=new Map(); (progress||[]).forEach(p=>{if(p&&p.playerKey)byKey.set(p.playerKey,p);});
    (progress||[]).forEach(p=>{totalPot+=Math.max(0,Number(p.round1Amount||0))+Math.max(0,Number(p.round2Amount||0));});
    (players||[]).forEach(pl=>{
      const p=byKey.get(pl.key)||null; if(!p)allJoined=false;
      const passed1=!!(p&&p.round1Passed),passed2=!!(p&&p.round2Passed),passed=r===1?passed1:(passed1||passed2);
      const amount=p?Math.max(0,Number(p[amountField]||0)):0,action=p?String(p[actionField]||'none'):'none';
      roundPot+=amount;
      if(!passed){activeKeys.push(pl.key); if(amount>highest)highest=amount;}
      rows.push({name:pl.name,key:pl.key,uid:p&&p.uid||'',joined:!!p,amount:amount,action:action,passed:passed,passedRound1:passed1,passedRound2:passed2});
    });
    let done=false;
    if(allJoined){
      if(activeKeys.length<=1) done=true;
      else if(highest>0) done=rows.filter(x=>!x.passed).every(x=>x.joined&&x.action!=='none'&&x.amount===highest);
    }
    return {round:r,rows:rows,highest:highest,roundPot:roundPot,totalPot:totalPot,allJoined:allJoined,activeKeys:activeKeys,done:done};
  }

    jackblackAction: async function(sessionId, action){
      const user = await ensureAnonymous();
      const id = String(sessionId || '').trim();
      if(!id){ throw new Error('Partita non valida.'); }
      const ref = doc(gmDb, 'gm_jackblack_partite', id);
      function valore(c){
        const v=Number(c && c.valore || 0);
        if(v===1) return 11;
        if(v>=11) return 10;
        return v;
      }
      function totale(carte){
        return (Array.isArray(carte)?carte:[]).reduce((sum,c)=>sum+valore(c),0);
      }
      function manoTesto(pg){
        const carte=Array.isArray(pg.carte)?pg.carte:[];
        return pg.nome+': '+(carte.length?carte.map(c=>String(c.nome||'Carta')).join(' + '):'nessuna carta')+' = '+totale(carte)+(pg.sforato?' (sforato)':(pg.fermo?' (sta)':''));
      }
      function statoTesto(data){
        const out=['Stato attuale'];
        (Array.isArray(data.giocatori)?data.giocatori:[]).forEach(pg=>out.push(manoTesto(pg)));
        return out.join('\n');
      }
      return runTransaction(gmDb, async function(tx){
        const snap=await tx.get(ref);
        if(!snap.exists()) throw new Error('Partita non trovata.');
        const data=snap.data();
        if(!data || data.game!=='jackblack') throw new Error('Sessione Jackblack non valida.');
        if(data.conclusa && action && action.type!=='finish') throw new Error('La partita è già conclusa.');
        data.giocatori=Array.isArray(data.giocatori)?data.giocatori:[];
        data.mazzo=Array.isArray(data.mazzo)?data.mazzo:[];
        data.eventi=Array.isArray(data.eventi)?data.eventi:[];
        const tipo=String(action && action.type || '');
        let eventText='';
        if(tipo==='draw' || tipo==='stand') {
          const pid=String(action && action.playerId || '');
          const pg=data.giocatori.find(p=>String(p.id)===pid);
          if(!pg) throw new Error('PG non trovato.');
          if(pg.fermo) throw new Error(pg.nome+' ha già scelto di stare oppure ha sforato.');
          pg.carte=Array.isArray(pg.carte)?pg.carte:[];
          if(tipo==='draw') {
            if(!data.mazzo.length) throw new Error('Il mazzo è terminato.');
            const carta=data.mazzo.pop();
            pg.carte.push(carta);
            const t=totale(pg.carte);
            if(t>21){ pg.sforato=true; pg.fermo=true; eventText=pg.nome+' chiede carta: '+carta.nome+'. Totale: '+t+'. Sfora 21.'; }
            else eventText=pg.nome+' chiede carta: '+carta.nome+'. Totale: '+t+'.';
          } else {
            pg.fermo=true;
            eventText=pg.nome+' sta con '+totale(pg.carte)+' punti.';
          }
          const riepilogo='Jackblack — Aggiornamento\n'+eventText+'\n\n'+statoTesto(data);
          data.eventi.push({seq:data.eventi.length+1,type:tipo,playerId:pg.id,playerName:pg.nome,text:eventText,summary:riepilogo});
        } else if(tipo==='finish') {
          if(!data.giocatori.length) throw new Error('Non ci sono partecipanti.');
          if(!data.giocatori.every(p=>!!p.fermo)) throw new Error('Tutti i PG devono prima avere scelto di stare o avere sforato.');
          let best=-1,winners=[];
          data.giocatori.forEach(function(pg){
            const t=totale(pg.carte);
            if(t<=21){
              if(t>best){best=t;winners=[pg.nome];}
              else if(t===best) winners.push(pg.nome);
            }
          });
          const pot=Number(data.puntata||0)*data.giocatori.length;
          let finalText='';
          if(winners.length===1){
            const net=pot-Number(data.puntata||0);
            finalText='Vince '+winners[0]+' con '+best+' punti. Piatto: '+pot+' Galeoni; guadagno netto del vincitore: +'+net+' Galeoni.';
          } else if(winners.length>1){
            finalText='Parità a '+best+' punti tra '+winners.join(', ')+'. Il regolamento non specifica come dividere il piatto: nessuna assegnazione automatica.';
          } else {
            finalText='Tutti hanno sforato 21. Il regolamento non specifica a chi vada il piatto.';
          }
          data.conclusa=true;
          data.risultatoFinale={winners:winners,best:best,pot:pot,text:finalText};
          const righe=['Jackblack — Esito finale'];
          data.giocatori.forEach(pg=>righe.push(manoTesto(pg)));
          righe.push('',finalText);
          if(winners.length===1){
            const winner=winners[0];
            data.giocatori.forEach(function(pg){
              if(pg.nome===winner) righe.push(pg.nome+': riceve '+pot+' Galeoni complessivi (saldo netto +'+(pot-Number(data.puntata||0))+' G).');
              else righe.push(pg.nome+': -'+Number(data.puntata||0)+' Galeoni.');
            });
          }
          data.eventi.push({seq:data.eventi.length+1,type:'finish',text:finalText,summary:righe.join('\n')});
        } else {
          throw new Error('Azione Jackblack non riconosciuta.');
        }
        data.updatedBy=user.uid;
        data.updatedAt=serverTimestamp();
        tx.set(ref,data,{merge:false});
        return {ok:true};
      });
    },

<script>
(function(){

/* ============================================================
   UTILITA' GENERALI
   ============================================================ */


function leggiIntero(input, fallback, minimo, massimo){
  var raw = input ? String(input.value).trim() : '';
  if(!/^-?\d+$/.test(raw)){
    if(input){ input.value = String(fallback); }
    return fallback;
  }
  var n = Number(raw);
  if(!Number.isSafeInteger(n)){ n = fallback; }
  if(minimo !== undefined && n < minimo){ n = minimo; }
  if(massimo !== undefined && n > massimo){ n = massimo; }
  if(input){ input.value = String(n); }
  return n;
}

function testoHtml(valore){
  return String(valore === undefined || valore === null ? '' : valore)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function creaEl(tag, classi, testo){
  var e = document.createElement(tag);
  if(classi){ e.className = classi; }
  if(testo !== undefined){ e.textContent = testo; }
  return e;
}

function aggancia(elemento, gestore){
  var nomeEvento = 'cli' + 'ck';
  elemento.addEventListener(nomeEvento, gestore);
}

function aggiungiLog(contenitore, html){
  var voce = creaEl('div', 'voce');
  voce.innerHTML = html;
  contenitore.insertBefore(voce, contenitore.firstChild);
}

function svuota(elemento){
  while(elemento.firstChild){
    elemento.removeChild(elemento.firstChild);
  }
}

function testoDado(valore){
  return '<span class="dado">' + valore + '</span>';
}


function codiceDadoForumGenerico(formula, etichetta){
  return '[dice=' + formula + ']' + String(etichetta || 'Tiro di dado') + '[/dice]';
}

function copiaTestoForum(testo, bottone){
  testo=String(testo===undefined||testo===null?'':testo);
  if(!testo){ return; }
  var originale=bottone ? bottone.textContent : '';
  function feedback(ok){
    if(!bottone){ return; }
    bottone.textContent=ok ? 'Copiato!' : 'Copia manualmente';
    window.setTimeout(function(){ bottone.textContent=originale; },1200);
  }
  function copiaConTextarea(){
    var ta=document.createElement('textarea');
    ta.value=testo;
    ta.setAttribute('readonly','');
    ta.setAttribute('aria-hidden','true');
    ta.style.position='fixed';
    ta.style.left='0';
    ta.style.top='0';
    ta.style.width='2px';
    ta.style.height='2px';
    ta.style.padding='0';
    ta.style.border='0';
    ta.style.outline='0';
    ta.style.boxShadow='none';
    ta.style.background='transparent';
    ta.style.opacity='0.01';
    ta.style.zIndex='-1';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try{ ta.setSelectionRange(0,ta.value.length); }catch(e){}
    var ok=false;
    try{ ok=!!document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    return ok;
  }
  function mostraCopiaManuale(){
    feedback(false);
    var vecchio=document.getElementById('gm-copia-manuale');
    if(vecchio&&vecchio.parentNode){vecchio.parentNode.removeChild(vecchio);}
    var overlay=document.createElement('div');
    overlay.id='gm-copia-manuale';
    overlay.style.position='fixed'; overlay.style.inset='0'; overlay.style.zIndex='2147483647';
    overlay.style.background='rgba(0,0,0,.78)'; overlay.style.display='flex'; overlay.style.alignItems='center'; overlay.style.justifyContent='center'; overlay.style.padding='20px';
    var box=document.createElement('div');
    box.style.width='min(680px,94vw)'; box.style.background='#171a1b'; box.style.border='1px solid #bfad03'; box.style.borderRadius='10px'; box.style.padding='16px'; box.style.boxSizing='border-box';
    var titolo=document.createElement('div'); titolo.textContent='Copia i dadi'; titolo.style.marginBottom='10px'; titolo.style.fontWeight='bold';
    var area=document.createElement('textarea'); area.value=testo; area.readOnly=true; area.style.width='100%'; area.style.minHeight='150px'; area.style.boxSizing='border-box';
    var chiudi=document.createElement('button'); chiudi.type='button'; chiudi.className='btn secondario piccolo'; chiudi.textContent='Chiudi'; chiudi.style.marginTop='10px';
    chiudi.addEventListener('click',function(){if(overlay.parentNode)overlay.parentNode.removeChild(overlay);});
    box.appendChild(titolo); box.appendChild(area); box.appendChild(chiudi); overlay.appendChild(box); document.body.appendChild(overlay);
    area.focus(); area.select(); try{area.setSelectionRange(0,area.value.length);}catch(e){}
  }
  /* In iframe/forum l'API Clipboard può essere vietata dalla Permissions Policy.
     Proviamo prima la copia sincrona durante il click, così conserviamo l'attivazione utente. */
  if(copiaConTextarea()){ feedback(true); return; }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(testo).then(function(){feedback(true);}).catch(mostraCopiaManuale);
      return;
    }
  }catch(e){}
  mostraCopiaManuale();
}

function leggiRisultatiDadi(input, quantita, facce){
  var raw=input ? String(input.value||'').trim() : '';
  if(!raw){ return {ok:false, errore:'Inserisci il risultato ottenuto sul forum.'}; }
  raw=raw.replace(/[\[\](){}]/g,' ');
  var parti=raw.split(/[\s,;|/]+/).filter(function(x){return x!=='';});
  if(parti.length!==quantita){
    return {ok:false, errore:'Servono esattamente '+quantita+' risultat'+(quantita===1?'o':'i')+'.'};
  }
  var valori=[];
  for(var i=0;i<parti.length;i++){
    if(!/^\d+$/.test(parti[i])){ return {ok:false, errore:'I risultati devono essere numeri interi.'}; }
    var n=Number(parti[i]);
    if(!Number.isSafeInteger(n)||n<1||n>facce){
      return {ok:false, errore:'Ogni risultato deve essere compreso tra 1 e '+facce+'.'};
    }
    valori.push(n);
  }
  return {ok:true, valori:valori};
}

function rigaDadoForum(formula, etichetta, placeholder){
  var riga=creaEl('div','bb-dado-riga');
  var info=creaEl('div','bb-dado-info');
  info.innerHTML='<span>'+testoHtml(etichetta)+'</span><span class="bb-dado-formula">'+testoHtml(formula)+'</span>';
  var copia=creaEl('button','btn secondario piccolo','Copia dado');
  copia.type='button';
  aggancia(copia,function(){ copiaTestoForum(codiceDadoForumGenerico(formula,etichetta),copia); });
  var input=creaEl('input','bb-dado-risultato');
  input.type='text';
  input.placeholder=placeholder||'Risultato';
  riga.appendChild(info); riga.appendChild(copia); riga.appendChild(input);
  return {riga:riga,input:input,copia:copia};
}

function gmErroreTesto(err){
  var msg = err && err.message ? String(err.message) : 'Operazione non riuscita.';
  return msg.replace(/^FirebaseError:\s*/i,'');
}

function gmSetMessaggio(el, testo, errore){
  if(!el){ return; }
  el.className = errore ? 'avviso' : 'nota';
  el.textContent = testo || '';
}

function gmCampoPassword(id, placeholder){
  var input = creaEl('input');
  input.type = 'password';
  input.id = id;
  input.placeholder = placeholder || 'Parola d\'ordine della partita';
  input.autocomplete = 'current-password';
  return input;
}

function gmSelectPartecipante(select, players){
  svuota(select);
  for(var i=0;i<players.length;i++){
    var opt = document.createElement('option');
    opt.value = players[i].id;
    opt.textContent = players[i].name + (players[i].claimed ? ' — accesso già impostato' : ' — primo accesso');
    select.appendChild(opt);
  }
}

function gmCartaTesto(c){
  if(!c){ return ''; }
  return c.name || ((c.number || '') + (c.color ? ' ' + c.color : ''));
}


/* Gestione elenco giocatori generico: nome + campi extra opzionali */
function creaGestoreGiocatori(contenitoreLista, campiExtra){
  var elenco = [];
  function render(){
    svuota(contenitoreLista);
    for(var i=0;i<elenco.length;i++){
      (function(idx){
        var g = elenco[idx];
        var li = creaEl('li');
        var testo = g.nome;
        if(campiExtra){
          for(var c=0;c<campiExtra.length;c++){
            var chiave = campiExtra[c].chiave;
            var etichetta = campiExtra[c].etichetta;
            testo = testo + ' — ' + etichetta + ': ' + g[chiave];
          }
        }
        var spanTesto = creaEl('span', null, testo);
        var bRimuovi = creaEl('button', 'btn rimuovi piccolo', 'Rimuovi');
        aggancia(bRimuovi, function(){
          elenco.splice(idx,1);
          render();
        });
        li.appendChild(spanTesto);
        li.appendChild(bRimuovi);
        contenitoreLista.appendChild(li);
      })(i);
    }
  }
  return {
    aggiungi: function(g){ elenco.push(g); render(); },
    lista: function(){ return elenco; },
    svuota: function(){ elenco = []; render(); },
    render: render
  };
}

/* ============================================================
   MAZZO STANDARD DA 52 (Bacchette, Pozioni, Pugnali, Galeoni)
   usato da Jackblack e Knocker
   ============================================================ */

var SEMI_52 = ['Bacchette','Pozioni','Pugnali','Galeoni'];
var NOMI_VALORE_52 = {1:'Specchio',11:'Ministro',12:'Regina',13:'Re'};

function nomeCarta52(valore, seme){
  var n = NOMI_VALORE_52[valore] ? NOMI_VALORE_52[valore] : String(valore);
  return n + ' di ' + seme;
}

function nuovoMazzo52(){
  var mazzo = [];
  for(var s=0;s<SEMI_52.length;s++){
    for(var v=1;v<=13;v++){
      mazzo.push({ valore:v, seme:SEMI_52[s], nome:nomeCarta52(v,SEMI_52[s]) });
    }
  }
  return mazzo;
}

function mescolaMazzo(mazzo){
  var m = mazzo.slice();
  for(var i=m.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp = m[i];
    m[i] = m[j];
    m[j] = tmp;
  }
  return m;
}

function valoreJackblack(carta){
  if(carta.valore === 1){ return 11; }
  if(carta.valore >= 11){ return 10; }
  return carta.valore;
}
