        '<h3>Lato A</h3>' +
        '<div class="riga"><label>Nome squadra / giocatore <input type="text" id="bb-nomeA" value="Squadra A"></label></div>' +
        '<div class="riga">' +
          '<label>Nome PG <input type="text" id="bb-playerA"></label>' +
          '<label>Destrezza <input type="number" id="bb-destA" value="10" min="1"></label>' +
          '<button class="btn secondario piccolo" id="bb-addA">Conferma</button>' +
        '</div>' +
        '<div class="bb-contatore" id="bb-countA">0/6 PG</div>' +
        '<ul class="giocatori" id="bb-listA"></ul>' +
      '</div>' +
      '<div class="bb-squadra">' +
        '<h3>Lato B</h3>' +
        '<div class="riga"><label>Nome squadra / giocatore <input type="text" id="bb-nomeB" value="Squadra B"></label></div>' +
        '<div class="riga">' +
          '<label>Nome PG <input type="text" id="bb-playerB"></label>' +
          '<label>Destrezza <input type="number" id="bb-destB" value="10" min="1"></label>' +
          '<button class="btn secondario piccolo" id="bb-addB">Conferma</button>' +
        '</div>' +
        '<div class="bb-contatore" id="bb-countB">0/6 PG</div>' +
        '<ul class="giocatori" id="bb-listB"></ul>' +
      '</div>' +
    '</div>' +
    '<div class="riquadro">' +
      '<div class="nota">Configurazione valida: 1 PG per lato per l’1 contro 1, oppure da 2 a 6 PG per ciascuna squadra. Dal primo tiro i roster restano bloccati fino all’azzeramento della partita.</div>' +
      '<div class="riga bb-lanciatori">' +
        '<label>PG che tira per <span id="bb-label-lanciatoreA">Squadra A</span> <select id="bb-lanciatoreA"></select></label>' +
        '<label>PG che tira per <span id="bb-label-lanciatoreB">Squadra B</span> <select id="bb-lanciatoreB"></select></label>' +
      '</div>' +
      '<div class="azioni">' +
        '<button class="btn" id="bb-tira-round">Prepara i 2 dadi del Round 1</button>' +
        '<button class="btn secondario" id="bb-azzera">Azzera risultato</button>' +
      '</div>' +
      '<div id="bb-messaggio" class="nota"></div>' +
      '<div class="bb-round-box" id="bb-round-area"></div>' +
    '</div>' +
    '<div class="log" id="bb-log"></div>' +
    '<div class="riquadro bb-riepilogo" id="bb-riepilogo"></div>';

  var squadre = { A: [], B: [] };
  var partita = nuovoStatoPartita();
  var sessioneId = null;
  var log = pannello.querySelector('#bb-log');
  var messaggio = pannello.querySelector('#bb-messaggio');
  var statoFirebase = pannello.querySelector('#bb-stato-firebase');
  var sessioniBox = pannello.querySelector('#bb-sessioni');
  var roundArea = pannello.querySelector('#bb-round-area');
  var riepilogo = pannello.querySelector('#bb-riepilogo');

  function idPg(){
    return 'pg_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
  }

  function nuovoStatoPartita(){
    return { rounds:[], tiroInCorso:null, vittorieA:0, vittorieB:0, malus:{}, conclusa:false };
  }

  function cloneSicuro(v){
    try { return JSON.parse(JSON.stringify(v)); } catch(e){ return null; }
  }

  function nomeLato(lato){
    var el = pannello.querySelector('#bb-nome' + lato);
    var fallback = lato === 'A' ? 'Squadra A' : 'Squadra B';
    return String(el && el.value ? el.value : fallback).trim() || fallback;
  }

  function configurazioneBloccata(){
    return partita.rounds.length > 0 || !!partita.tiroInCorso;
  }

  function aggiornaBloccoConfigurazione(){
    var blocco = configurazioneBloccata();
    pannello.querySelector('#bb-nomeA').disabled = blocco;
    pannello.querySelector('#bb-nomeB').disabled = blocco;
    pannello.querySelector('#bb-playerA').disabled = blocco;
    pannello.querySelector('#bb-playerB').disabled = blocco;
    pannello.querySelector('#bb-destA').disabled = blocco;
    pannello.querySelector('#bb-destB').disabled = blocco;
    pannello.querySelector('#bb-addA').disabled = blocco || squadre.A.length >= 6;
    pannello.querySelector('#bb-addB').disabled = blocco || squadre.B.length >= 6;
  }

  function caliciPg(pg){
    return Math.max(0, parseInt(partita.malus && partita.malus[pg.id],10) || 0);
  }

  function renderSquadra(lato){
    var lista = pannello.querySelector('#bb-list' + lato);
    var contatore = pannello.querySelector('#bb-count' + lato);
    svuota(lista);
    for(var i=0;i<squadre[lato].length;i++){
      (function(idx){
        var pg = squadre[lato][idx];
        var li = creaEl('li');
        var calici = caliciPg(pg);
        var span = creaEl('span', null, pg.nome + ' — Destrezza ' + pg.destrezza + (calici ? ' · Calici ' + calici : ''));
        var rim = creaEl('button', 'btn piccolo rimuovi', 'Rimuovi');
        rim.type = 'button';
        rim.disabled = configurazioneBloccata();
        aggancia(rim, function(){
          if(configurazioneBloccata()) return;
          squadre[lato].splice(idx,1);
          renderSquadra(lato);
          renderLanciatori();
          aggiornaBloccoConfigurazione();
          gmSetMessaggio(messaggio, '', false);
        });
        li.appendChild(span);
        li.appendChild(rim);
        lista.appendChild(li);
      })(i);
    }
    contatore.textContent = squadre[lato].length + '/6 PG';
    aggiornaBloccoConfigurazione();
  }

  function aggiungiPg(lato){
    if(configurazioneBloccata()){
      gmSetMessaggio(messaggio, 'Azzera il risultato prima di modificare i partecipanti.', true);
      return;
    }
    if(squadre[lato].length >= 6){
      gmSetMessaggio(messaggio, 'Ogni lato può avere al massimo 6 PG.', true);
      return;
    }
    var nomeInput = pannello.querySelector('#bb-player' + lato);
    var destInput = pannello.querySelector('#bb-dest' + lato);
    var nome = String(nomeInput.value || '').trim();
    if(!nome){
      gmSetMessaggio(messaggio, 'Inserisci il nome del PG prima di aggiungerlo.', true);
      return;
    }
    var dest = leggiIntero(destInput, 10, 1);
    squadre[lato].push({ id:idPg(), nome:nome, destrezza:dest });
    nomeInput.value = '';
    renderSquadra(lato);
    renderLanciatori();
    gmSetMessaggio(messaggio, '', false);
  }

  function configurazioneValida(){
    var a = squadre.A.length;
    var b = squadre.B.length;
    if(a === 1 && b === 1){ return true; }
    return a >= 2 && a <= 6 && b >= 2 && b <= 6;
  }

  function trovaPg(lato, id){
    var arr = squadre[lato] || [];
    for(var i=0;i<arr.length;i++) if(arr[i].id === id) return arr[i];
    return null;
  }

  function renderLanciatori(){
    ['A','B'].forEach(function(lato){
      var sel = pannello.querySelector('#bb-lanciatore' + lato);
      var label = pannello.querySelector('#bb-label-lanciatore' + lato);
      if(!sel) return;
      if(label) label.textContent = nomeLato(lato);
      var precedente = sel.value;
      var inCorso = partita.tiroInCorso && Array.isArray(partita.tiroInCorso['tiri' + lato]) && partita.tiroInCorso['tiri' + lato][0]
        ? partita.tiroInCorso['tiri' + lato][0].id : '';
      svuota(sel);
      var arr = squadre[lato] || [];
      if(!arr.length){
        var vuoto = document.createElement('option');
        vuoto.value=''; vuoto.textContent='Inserisci prima i PG';
        sel.appendChild(vuoto);
      } else {
        for(var i=0;i<arr.length;i++){
          var op=document.createElement('option');
          op.value=arr[i].id;
          op.textContent=arr[i].nome + ' — Destrezza ' + arr[i].destrezza;
          sel.appendChild(op);
        }
        var voluto = inCorso || precedente;
        if(voluto && trovaPg(lato,voluto)) sel.value=voluto;
      }
      sel.disabled = !!partita.tiroInCorso || partita.conclusa || !arr.length;
    });
  }

  function tiriLato(lato){
    var sel = pannello.querySelector('#bb-lanciatore' + lato);
    var pg = trovaPg(lato, sel ? sel.value : '');
    if(!pg && squadre[lato].length) pg = squadre[lato][0];
    if(!pg) return { risultati:[], massimo:null };
    return { risultati:[{ id:pg.id, nome:pg.nome, destrezza:pg.destrezza, tiro:null }], massimo:null };
  }

  function valoreTiroValido(r){
    var v = parseInt(r && r.tiro,10);
    var max = Math.max(1, parseInt(r && r.destrezza,10) || 1);
    return Number.isFinite(v) && v >= 1 && v <= max ? v : null;
  }

  function tuttiRisultatiInseriti(t){
    if(!t || !Array.isArray(t.tiriA) || !Array.isArray(t.tiriB)) return false;
    var tutti = t.tiriA.concat(t.tiriB);
    if(!tutti.length) return false;
    for(var i=0;i<tutti.length;i++) if(valoreTiroValido(tutti[i]) === null) return false;
    return true;
  }

  function aggiornaMassimiTiro(t){
    if(!t) return;
    var maxA = null, maxB = null;
    var i, v;
    for(i=0;i<t.tiriA.length;i++){ v=valoreTiroValido(t.tiriA[i]); if(v !== null && (maxA === null || v > maxA)) maxA=v; }
    for(i=0;i<t.tiriB.length;i++){ v=valoreTiroValido(t.tiriB[i]); if(v !== null && (maxB === null || v > maxB)) maxB=v; }
    t.massimoA=maxA; t.massimoB=maxB;
  }

  function codiceDadoForum(r, numeroRound, nomeSquadra){
    return '[dice=1d' + r.destrezza + ']Burrobirra-Pong - Round ' + numeroRound + ' - ' + nomeSquadra + '[/dice]';
  }

  function copiaTestoBurrobirra(testo, bottone){
    copiaTestoForum(testo,bottone);
  }

  function descriviTiri(t){
    var arr = Array.isArray(t) ? t : (t && Array.isArray(t.risultati) ? t.risultati : []);
    var parti = [];
    for(var i=0;i<arr.length;i++){
      var r = arr[i];
      var v = valoreTiroValido(r);
      parti.push(testoHtml(r.nome) + ' 1d' + r.destrezza + ' ' + (v === null ? '<span class="dado">?</span>' : testoDado(v)));
    }
    return parti.join(' · ');
  }

  function effettoCalici(n){
    n = Math.max(0, parseInt(n,10) || 0);
    if(!n) return 'Nessun malus';
    return '-1 Resistenza per ' + n + (n === 1 ? ' post successivo' : ' post successivi');
  }

  function statoPartita(){
    return {
      nomeA: nomeLato('A'),
      nomeB: nomeLato('B'),
      squadraA: squadre.A.map(function(pg){ return { id:pg.id, nome:pg.nome, destrezza:pg.destrezza }; }),
      squadraB: squadre.B.map(function(pg){ return { id:pg.id, nome:pg.nome, destrezza:pg.destrezza }; }),
      partita: cloneSicuro(partita) || nuovoStatoPartita()
    };
  }

  function normalizzaSquadra(arr){
    return Array.isArray(arr) ? arr.slice(0,6).map(function(pg){
      return {
        id: String(pg && pg.id ? pg.id : idPg()).slice(0,60),
        nome: String(pg && pg.nome ? pg.nome : '').slice(0,100),
        destrezza: Math.max(1, parseInt(pg && pg.destrezza,10) || 1)
      };
    }).filter(function(pg){ return !!pg.nome; }) : [];
  }

  function normalizzaPartita(raw){
    var base = nuovoStatoPartita();
    if(!raw || typeof raw !== 'object') return base;
    base.rounds = Array.isArray(raw.rounds) ? raw.rounds.slice(0,3) : [];
    base.tiroInCorso = raw.tiroInCorso && typeof raw.tiroInCorso === 'object' ? raw.tiroInCorso : null;
    if(base.tiroInCorso){
      base.tiroInCorso.tiriA = Array.isArray(base.tiroInCorso.tiriA) ? base.tiroInCorso.tiriA : [];
      base.tiroInCorso.tiriB = Array.isArray(base.tiroInCorso.tiriB) ? base.tiroInCorso.tiriB : [];
      aggiornaMassimiTiro(base.tiroInCorso);
    }
    base.vittorieA = Math.max(0, parseInt(raw.vittorieA,10) || 0);
    base.vittorieB = Math.max(0, parseInt(raw.vittorieB,10) || 0);
    base.malus = raw.malus && typeof raw.malus === 'object' ? raw.malus : {};
    base.conclusa = !!raw.conclusa || base.rounds.length >= 3;
    return base;
  }

  function ripristinaStato(data){
    pannello.querySelector('#bb-nomeA').value = data && data.nomeA ? String(data.nomeA) : 'Squadra A';
    pannello.querySelector('#bb-nomeB').value = data && data.nomeB ? String(data.nomeB) : 'Squadra B';
    squadre.A = normalizzaSquadra(data && data.squadraA);
    squadre.B = normalizzaSquadra(data && data.squadraB);
    partita = Number(data && data.schemaVersion) >= 2 ? normalizzaPartita(data.partita) : nuovoStatoPartita();
    renderTutto();
  }

  function renderLog(){
    svuota(log);
    var nomeA = nomeLato('A');
    var nomeB = nomeLato('B');
    for(var i=0;i<partita.rounds.length;i++){
      var r = partita.rounds[i];
      var vincitoreNome = r.vincitore === 'A' ? nomeA : nomeB;
      var perdenteNome = r.vincitore === 'A' ? nomeB : nomeA;
      var html = '<b>Round ' + (i+1) + '</b><br>' +
        '<b>' + testoHtml(nomeA) + '</b>: ' + descriviTiri(r.tiriA) + ' — migliore ' + testoDado(r.massimoA) + '<br>' +
        '<b>' + testoHtml(nomeB) + '</b>: ' + descriviTiri(r.tiriB) + ' — migliore ' + testoDado(r.massimoB) + '<br>' +
        '<span class="vincitore">Round a ' + testoHtml(vincitoreNome) + '</span> · ' + testoHtml(r.bevitoreNome) + ' (' + testoHtml(perdenteNome) + ') beve 1 calice: -1 Resistenza.';
      aggiungiLog(log, html);
    }
  }

  function renderRiepilogo(){
    var tutti = [];
    for(var a=0;a<squadre.A.length;a++) tutti.push({ lato:'A', pg:squadre.A[a] });
    for(var b=0;b<squadre.B.length;b++) tutti.push({ lato:'B', pg:squadre.B[b] });
    var titolo = partita.conclusa ? 'Riepilogo finale' : 'Malus accumulati finora';
    var html = '<h3 style="margin-top:0">' + titolo + '</h3>';
    if(!tutti.length){
      riepilogo.innerHTML = html + '<div class="nota">Inserisci i partecipanti per vedere il riepilogo.</div>';
      return;
    }
    if(partita.conclusa){
      var vincitore = partita.vittorieA > partita.vittorieB ? nomeLato('A') : nomeLato('B');
      html += '<p><span class="vincitore"><b>' + testoHtml(vincitore) + '</b> vince ' + partita.vittorieA + '-' + partita.vittorieB + '.</span></p>';
    } else {
      html += '<div class="bb-malus-live">Round confermati: ' + partita.rounds.length + '/3 · Punteggio ' + partita.vittorieA + '-' + partita.vittorieB + '.</div>';
    }
    html += '<table><thead><tr><th>PG</th><th>Squadra</th><th>Calici</th><th>Malus</th></tr></thead><tbody>';
    for(var i=0;i<tutti.length;i++){
      var item = tutti[i];
      var n = caliciPg(item.pg);
      html += '<tr><td>' + testoHtml(item.pg.nome) + '</td><td>' + testoHtml(nomeLato(item.lato)) + '</td><td>' + n + '</td><td>' + testoHtml(effettoCalici(n)) + '</td></tr>';
    }
    html += '</tbody></table>';
    riepilogo.innerHTML = html;
  }

  function aggiornaSelectBevitore(selVincitore, selBevitore){
    var vincitore = selVincitore.value;
    svuota(selBevitore);
    if(vincitore !== 'A' && vincitore !== 'B'){
      var op0 = document.createElement('option'); op0.value=''; op0.textContent='Seleziona prima la squadra vincente'; selBevitore.appendChild(op0); selBevitore.disabled=true; return;
    }
    var perdente = vincitore === 'A' ? 'B' : 'A';
    var arr = squadre[perdente];
    for(var i=0;i<arr.length;i++){
      var op = document.createElement('option');
      op.value = arr[i].id;
      op.textContent = arr[i].nome;
      selBevitore.appendChild(op);
    }
    selBevitore.disabled = !arr.length;
  }

  function renderRoundArea(){
    svuota(roundArea);
    var bottoneTira = pannello.querySelector('#bb-tira-round');
    if(partita.conclusa){
      bottoneTira.disabled = true;
      bottoneTira.textContent = 'Partita conclusa';
      roundArea.appendChild(creaEl('div','successo','I 3 round sono stati completati. Il riepilogo finale è qui sotto.'));
      return;
    }
    var numero = partita.rounds.length + 1;
    bottoneTira.textContent = 'Prepara i 2 dadi del Round ' + numero;
    bottoneTira.disabled = !!partita.tiroInCorso || !configurazioneValida();
    if(!partita.tiroInCorso){
      roundArea.appendChild(creaEl('div','nota',configurazioneValida() ? 'Round ' + numero + ' di 3: scegli un PG per squadra, prepara i due dadi e copiali sul forum; dopo il lancio inserisci qui i due risultati.' : 'Conferma prima una configurazione valida: 1 PG per lato oppure da 2 a 6 PG per entrambe le squadre.'));
      return;
    }

    var t = partita.tiroInCorso;
    aggiornaMassimiTiro(t);
    var box = creaEl('div','bb-scelta-round');
    var titolo = creaEl('h3',null,'Round ' + numero);
    titolo.style.marginTop='0';
    box.appendChild(titolo);

    var istr = creaEl('div','nota','Copia i due dadi, uno per squadra, nel forum e inserisci qui i risultati realmente ottenuti. Il dado usa la Destrezza del PG scelto per quel round.');
    box.appendChild(istr);

    var copiaTutti = creaEl('button','btn secondario piccolo bb-copia-tutti','Copia i 2 dadi del round');
    copiaTutti.type='button';
    aggancia(copiaTutti,function(){
      var righe=[];
      for(var i=0;i<t.tiriA.length;i++) righe.push(codiceDadoForum(t.tiriA[i],numero,nomeLato('A')));
      for(var j=0;j<t.tiriB.length;j++) righe.push(codiceDadoForum(t.tiriB[j],numero,nomeLato('B')));
      copiaTestoBurrobirra(righe.join('\n'),copiaTutti);
    });
    box.appendChild(copiaTutti);

    var griglia = creaEl('div','bb-tiri');

    function creaLato(lato, tiri){
      var latoBox=creaEl('div','bb-tiro-lato');
      var head=creaEl('b',null,nomeLato(lato)); latoBox.appendChild(head);
      for(var i=0;i<tiri.length;i++){
        (function(r){
          var riga=creaEl('div','bb-dado-riga');
          var info=creaEl('div','bb-dado-info');
          info.innerHTML='<span>' + testoHtml(r.nome) + '</span><span class="bb-dado-formula">1d' + r.destrezza + '</span>';
          var cp=creaEl('button','btn secondario piccolo','Copia'); cp.type='button';
          aggancia(cp,function(){ copiaTestoBurrobirra(codiceDadoForum(r,numero,nomeLato(lato)),cp); });
          var inp=document.createElement('input');
          inp.type='number'; inp.className='bb-dado-risultato'; inp.min='1'; inp.max=String(r.destrezza); inp.step='1'; inp.placeholder='Risultato';
          var vv=valoreTiroValido(r); if(vv !== null) inp.value=String(vv);
          function registra(salva){
            var v=parseInt(inp.value,10);
            if(!Number.isFinite(v) || v<1 || v>r.destrezza){
              r.tiro=null;
              if(inp.value!=='') gmSetMessaggio(messaggio,'Il risultato di ' + r.nome + ' deve essere compreso tra 1 e ' + r.destrezza + '.',true);
            } else {
              r.tiro=v;
              gmSetMessaggio(messaggio,'',false);
            }
            aggiornaMassimiTiro(t);
            aggiornaZonaEsito();
            if(salva && sessioneId) salvaFirebase(true);
          }
          inp.addEventListener('input',function(){ registra(false); });
          inp.addEventListener('change',function(){ registra(true); });
          riga.appendChild(info); riga.appendChild(cp); riga.appendChild(inp); latoBox.appendChild(riga);
        })(tiri[i]);
      }
      return latoBox;
    }

    griglia.appendChild(creaLato('A',t.tiriA));
    griglia.appendChild(creaLato('B',t.tiriB));
    box.appendChild(griglia);

    var esitoParziale=creaEl('div','bb-esito-parziale');
    box.appendChild(esitoParziale);

    var controlli=creaEl('div');
    box.appendChild(controlli);
    roundArea.appendChild(box);

    function aggiornaZonaEsito(){
      aggiornaMassimiTiro(t);
      svuota(controlli);
      if(!tuttiRisultatiInseriti(t)){
        esitoParziale.textContent='Inserisci entrambi i risultati prima di assegnare il round.';
        return;
      }
      esitoParziale.innerHTML='<b>Migliore ' + testoHtml(nomeLato('A')) + ':</b> ' + testoDado(t.massimoA) + ' · <b>Migliore ' + testoHtml(nomeLato('B')) + ':</b> ' + testoDado(t.massimoB);

      var riga = creaEl('div','riga');
      var labV = creaEl('label',null,'Squadra vincente del round ');
      var selV = document.createElement('select');
      selV.id = 'bb-vincitore-round';
      var vuoto = document.createElement('option'); vuoto.value=''; vuoto.textContent='Seleziona'; selV.appendChild(vuoto);
      var oa = document.createElement('option'); oa.value='A'; oa.textContent=nomeLato('A'); selV.appendChild(oa);
      var ob = document.createElement('option'); ob.value='B'; ob.textContent=nomeLato('B'); selV.appendChild(ob);
      var vincitoreAutomatico='';
      if(t.massimoA > t.massimoB) vincitoreAutomatico='A';
      if(t.massimoB > t.massimoA) vincitoreAutomatico='B';
      if(vincitoreAutomatico){selV.value=vincitoreAutomatico;selV.disabled=true;}
      labV.appendChild(selV); riga.appendChild(labV);

      var labB = creaEl('label',null,'PG della squadra perdente che beve ');
      var selB = document.createElement('select');
      selB.id = 'bb-bevitore-round';
      labB.appendChild(selB); riga.appendChild(labB); controlli.appendChild(riga);

      var nota = creaEl('div','nota',vincitoreAutomatico ? 'Il risultato più alto determina automaticamente la squadra vincente del round.' : 'I risultati sono pari: il regolamento non stabilisce uno spareggio, quindi indica la squadra vincente secondo quanto stabilito nella role.');
      controlli.appendChild(nota);
      var az = creaEl('div','azioni');
      var conferma = creaEl('button','btn','Conferma round e assegna il malus'); conferma.type='button'; az.appendChild(conferma); controlli.appendChild(az);

      aggiornaSelectBevitore(selV,selB);
      aggancia(selV,function(){ aggiornaSelectBevitore(selV,selB); });
      aggancia(conferma,function(){
        if(!tuttiRisultatiInseriti(t)){ gmSetMessaggio(messaggio,'Inserisci prima entrambi i risultati dei dadi.',true); return; }
        var vincitore=selV.value;
        if(vincitore!=='A' && vincitore!=='B'){ gmSetMessaggio(messaggio,'Seleziona la squadra vincente del round.',true); return; }
        var perdente=vincitore==='A'?'B':'A';
        var bevitoreId=selB.value, bevitore=null;
        for(var i=0;i<squadre[perdente].length;i++) if(squadre[perdente][i].id===bevitoreId) bevitore=squadre[perdente][i];
        if(!bevitore){ gmSetMessaggio(messaggio,'Seleziona il PG della squadra perdente che beve il calice.',true); return; }
        aggiornaMassimiTiro(t);
        var r={round:partita.rounds.length+1,tiriA:cloneSicuro(t.tiriA),tiriB:cloneSicuro(t.tiriB),massimoA:t.massimoA,massimoB:t.massimoB,vincitore:vincitore,bevitoreId:bevitore.id,bevitoreNome:bevitore.nome};
        partita.rounds.push(r);
        if(vincitore==='A') partita.vittorieA++; else partita.vittorieB++;
        partita.malus[bevitore.id]=caliciPg(bevitore)+1;
        partita.tiroInCorso=null;
        partita.conclusa=partita.rounds.length>=3;
        gmSetMessaggio(messaggio,'Round ' + r.round + ' registrato: ' + bevitore.nome + ' beve 1 calice.',false);
        renderTutto();
        if(sessioneId) salvaFirebase(true);
      });
    }

    aggiornaZonaEsito();
  }

  function renderTutto(){
    renderSquadra('A');
    renderSquadra('B');
    renderLanciatori();
    renderLog();
    renderRoundArea();
    renderRiepilogo();
    aggiornaBloccoConfigurazione();
  }

  function resetRisultato(){
    partita = nuovoStatoPartita();
    renderTutto();
  }

  function nuovaPartita(){
    sessioneId = null;
    squadre.A = [];
    squadre.B = [];
    partita = nuovoStatoPartita();
    pannello.querySelector('#bb-nomeA').value='Squadra A';
    pannello.querySelector('#bb-nomeB').value='Squadra B';
    pannello.querySelector('#bb-playerA').value='';
    pannello.querySelector('#bb-playerB').value='';
    pannello.querySelector('#bb-destA').value='10';
    pannello.querySelector('#bb-destB').value='10';
    renderTutto();
    evidenziaSessioneCorrente();
    gmSetMessaggio(statoFirebase,'Nuova partita pronta. Verrà aggiunta all’elenco quando la salvi.',false);
    gmSetMessaggio(messaggio,'',false);
  }

  function statoSessioneTesto(item){
    var p = item && item.partita ? item.partita : null;
    if(!p) return 'Configurazione salvata';
    var n = Array.isArray(p.rounds) ? p.rounds.length : 0;
    if(p.conclusa || n >= 3) return 'Conclusa';
    if(p.tiroInCorso) return 'Round ' + (n+1) + ' in corso';
    return n ? ('Dopo il Round ' + n) : 'Da iniziare';
  }

  function evidenziaSessioneCorrente(){
    var cards = sessioniBox.querySelectorAll('.bb-sessione');
    for(var i=0;i<cards.length;i++){
      var corrente = sessioneId && cards[i].dataset.sessionId === sessioneId;
      cards[i].classList.toggle('bb-sessione-corrente', !!corrente);
    }
  }

  function renderSessioni(items){
    svuota(sessioniBox);
    if(!items || !items.length){
      sessioniBox.appendChild(creaEl('div','nota','Non ci sono ancora partite di Burrobirra-Pong salvate.'));
      return;
    }
    for(var i=0;i<items.length;i++){
      (function(item){
        var card = creaEl('div','bb-sessione');
        card.dataset.sessionId = item.id;
        var top = creaEl('div','bb-sessione-top');
        var info = document.createElement('div');
        var na = item.nomeA || 'Squadra A', nb = item.nomeB || 'Squadra B';
        var qa = Array.isArray(item.squadraA) ? item.squadraA.length : 0;
        var qb = Array.isArray(item.squadraB) ? item.squadraB.length : 0;
        info.innerHTML = '<div class="bb-sessione-titolo">' + testoHtml(na) + ' vs ' + testoHtml(nb) + '</div>' +
          '<div class="bb-sessione-meta">' + qa + ' PG vs ' + qb + ' PG · ' + testoHtml(statoSessioneTesto(item)) + '</div>';
        var apri = creaEl('button','btn secondario piccolo','Apri partita');
        apri.type='button';
        aggancia(apri,function(){ apriSessione(item.id); });
        top.appendChild(info); top.appendChild(apri); card.appendChild(top); sessioniBox.appendChild(card);
      })(items[i]);
    }
    evidenziaSessioneCorrente();
  }

  function caricaElencoSessioni(silenzioso){
    if(!window.gmApi || !window.gmApi.listBurrobirra){
      if(!silenzioso) gmSetMessaggio(statoFirebase,'Firebase non è ancora pronto. Riprova tra un istante.',true);
      return Promise.resolve([]);
    }
    if(!silenzioso) gmSetMessaggio(statoFirebase,'Aggiornamento delle partite salvate…',false);
    return window.gmApi.listBurrobirra().then(function(items){
      renderSessioni(items);
      if(!silenzioso) gmSetMessaggio(statoFirebase,'Elenco aggiornato: ' + items.length + (items.length === 1 ? ' partita.' : ' partite.'),false);
      return items;
    }).catch(function(err){
      gmSetMessaggio(statoFirebase,'Impossibile leggere le partite salvate: ' + gmErroreTesto(err) + (String(err && err.code || '').indexOf('permission-denied') !== -1 ? ' — controlla che le Firestore Rules pubblicate consentano la lettura di gm_burrobirra_partite.' : ''),true);
      return [];
    });
  }

  function apriSessione(id){
    if(!window.gmApi || !window.gmApi.loadBurrobirra){
      gmSetMessaggio(statoFirebase,'Firebase non è ancora pronto. Riprova tra un istante.',true); return;
    }
    gmSetMessaggio(statoFirebase,'Apertura della partita…',false);
    window.gmApi.loadBurrobirra(id).then(function(data){
      sessioneId = data.id;
      ripristinaStato(data);
      evidenziaSessioneCorrente();
      if(Number(data.schemaVersion || 1) < 2){
        gmSetMessaggio(statoFirebase,'Partita precedente caricata: roster recuperato. Il vecchio risultato non conteneva l’assegnazione individuale dei calici ed è stato azzerato.',false);
      } else {
        gmSetMessaggio(statoFirebase,'Partita aperta. Qualunque giocatore può aggiornarla.',false);
      }
      gmSetMessaggio(messaggio,'',false);
    }).catch(function(err){ gmSetMessaggio(statoFirebase,'Apertura non riuscita: ' + gmErroreTesto(err),true); });
  }

  function salvaFirebase(silenzioso){
    if(!window.gmApi || !window.gmApi.saveBurrobirra){
      if(!silenzioso) gmSetMessaggio(statoFirebase,'Firebase non è ancora pronto. Riprova tra un istante.',true);
      return Promise.resolve(false);
    }
    if(!configurazioneValida()){
      if(!silenzioso) gmSetMessaggio(statoFirebase,'Prima di salvare inserisci 1 PG per lato oppure 2–6 PG per entrambe le squadre.',true);
      return Promise.resolve(false);
    }
    if(!silenzioso) gmSetMessaggio(statoFirebase, sessioneId ? 'Aggiornamento della partita…' : 'Salvataggio della nuova partita…',false);
    return window.gmApi.saveBurrobirra(sessioneId, statoPartita()).then(function(res){
      sessioneId = res.id;
      if(!silenzioso) gmSetMessaggio(statoFirebase,'Partita salvata e visibile a tutti i giocatori.',false);
      return caricaElencoSessioni(true).then(function(){ return true; });
    }).catch(function(err){
      gmSetMessaggio(statoFirebase,'Salvataggio non riuscito: ' + gmErroreTesto(err),true);
      return false;
    });
  }

  aggancia(pannello.querySelector('#bb-addA'), function(){ aggiungiPg('A'); });
  aggancia(pannello.querySelector('#bb-addB'), function(){ aggiungiPg('B'); });
  pannello.querySelector('#bb-nomeA').addEventListener('input', function(){ renderLanciatori(); renderRiepilogo(); });
  pannello.querySelector('#bb-nomeB').addEventListener('input', function(){ renderLanciatori(); renderRiepilogo(); });
  aggancia(pannello.querySelector('#bb-salva'), function(){ salvaFirebase(false); });
  aggancia(pannello.querySelector('#bb-nuova'), function(){ nuovaPartita(); });
  aggancia(pannello.querySelector('#bb-aggiorna-sessioni'), function(){ caricaElencoSessioni(false); });

  aggancia(pannello.querySelector('#bb-azzera'), function(){
    resetRisultato();
    gmSetMessaggio(messaggio,'Risultato e malus azzerati. I partecipanti restano inseriti.',false);
    if(sessioneId) salvaFirebase(true);
  });

  aggancia(pannello.querySelector('#bb-tira-round'), function(){
    if(!configurazioneValida()){
      gmSetMessaggio(messaggio,'Servono 1 PG per lato per l’1 contro 1, oppure da 2 a 6 PG per ciascuna squadra.',true); return;
    }
    if(partita.conclusa || partita.tiroInCorso) return;
    var tA = tiriLato('A'), tB = tiriLato('B');
    if(!tA.risultati.length || !tB.risultati.length){
      gmSetMessaggio(messaggio,'Seleziona il PG che tira per entrambe le squadre.',true); return;
    }
    partita.tiroInCorso = { tiriA:tA.risultati, tiriB:tB.risultati, massimoA:null, massimoB:null };
    gmSetMessaggio(messaggio,'I 2 dadi del Round ' + (partita.rounds.length+1) + ' sono pronti: uno per ' + nomeLato('A') + ' e uno per ' + nomeLato('B') + '.',false);
    renderTutto();
    if(sessioneId) salvaFirebase(true);
  });

  renderTutto();
  window.setTimeout(function(){ caricaElencoSessioni(false); }, 0);
}

/* ============================================================
   2. CORSE DEI CAVALLI ALATI
   ============================================================ */

function initCavalli(pannello){
  pannello.innerHTML =
    '<h2>Corse dei Cavalli Alati</h2>' +
    '<p class="intro">7 Cavalli Alati (numerati 1-7). La gara dura 5 round: ad ogni round viene lanciato un solo 1d7 sul forum e il risultato assegna 1 punto al Cavallo con quel numero. Al termine vince il Cavallo con più punti; in caso di parità vince, tra i Cavalli a pari punti, quello che si è aggiudicato il round più recente.</p>' +
    '<div class="riquadro">' +
      '<div class="riga">' +
        '<label>Nome PG <input type="text" id="cv-nome"></label>' +
        '<label>Scommette sul Cavallo <select id="cv-cavallo"></select></label>' +
        '<label>Puntata (Galeoni) <input type="number" id="cv-puntata" value="1" min="1"></label>' +
        '<button class="btn secondario piccolo" id="cv-aggiungi">Conferma</button>' +
      '</div>' +
      '<div class="nota">Ogni PG può scommettere su uno o più Cavalli, indicando una puntata distinta per ciascuno. Le scommesse sono a quota fissa 1:1 e vengono risolte separatamente; al termine il tool calcola il saldo complessivo del PG. Essendo una giocata contro il banco, la variazione OFFGame massima per role è ±50 Galeoni sul saldo complessivo; eventuali eccedenze restano valide soltanto ONGame.</div>' +
    '</div>' +
    '<ul class="giocatori" id="cv-lista"></ul>' +
    '<div class="riquadro">' +
      '<div class="riga">' +
        '<label>Nomi dei Cavalli (facoltativo, separati da virgola, in ordine 1-7) <input type="text" id="cv-nomi-cavalli" style="width:340px"></label>' +
        '<button class="btn secondario piccolo" id="cv-nuova">Nuova gara</button>' +
      '</div>' +
    '</div>' +
    '<div class="riquadro">' +
      '<div class="riga" id="cv-round-nav"></div>' +
      '<div id="cv-round-area" style="margin-top:14px"></div>' +
    '</div>' +
    '<div class="log" id="cv-log"></div>';

  var selCavallo = pannello.querySelector('#cv-cavallo');
  for(var n=1;n<=7;n++){
    var opt = creaEl('option', null, 'Cavallo ' + n);
    opt.value = n;
    selCavallo.appendChild(opt);
  }

  var lista = pannello.querySelector('#cv-lista');
  var btnAggiungi = pannello.querySelector('#cv-aggiungi');
  var inputNomiCavalli = pannello.querySelector('#cv-nomi-cavalli');
  var roundNav = pannello.querySelector('#cv-round-nav');
  var roundArea = pannello.querySelector('#cv-round-area');
  var log = pannello.querySelector('#cv-log');
  var scommettitori = [];
  var gara = nuovaGara();

  function nuovaGara(){
    return {
      iniziata:false,
      conclusa:false,
      giocatori:[],
      nomiCavalli:[],
      punti:[0,0,0,0,0,0,0,0],
      rounds:[],
      roundAttivo:null
    };
  }

  function copiaTestoCavalli(testo, bottone){
    copiaTestoForum(testo,bottone);
  }

  function codiceDadoCv(numeroRound){
    return '[dice=1d7]Corse dei Cavalli Alati - Round ' + numeroRound + '[/dice]';
  }

  function leggiNomiCavalli(){
    var raw=inputNomiCavalli.value.trim();
    if(!raw) return [];
    return raw.split(',').map(function(x){ return x.trim(); });
  }

  function nomeCavallo(numero){
    var idx=numero-1;
    var nome=gara.nomiCavalli[idx] || '';
    return nome ? nome + ' (Cavallo ' + numero + ')' : 'Cavallo ' + numero;
  }

  function trovaScommettitore(nome){
    var chiave=String(nome || '').trim().toLocaleLowerCase('it');
    for(var i=0;i<scommettitori.length;i++){
      if(String(scommettitori[i].nome || '').trim().toLocaleLowerCase('it')===chiave) return scommettitori[i];
    }
    return null;
  }

  function renderScommettitori(){
    svuota(lista);
    for(var i=0;i<scommettitori.length;i++){
      (function(indicePg){
        var pg=scommettitori[indicePg];
        var li=creaEl('li');
        li.style.display='block';
        li.style.padding='10px';

        var testa=creaEl('div','riga');
        testa.style.justifyContent='space-between';
        testa.appendChild(creaEl('b',null,pg.nome));
        var totale=0;
        for(var t=0;t<pg.scommesse.length;t++) totale+=Math.max(0,parseInt(pg.scommesse[t].puntata,10)||0);
        testa.appendChild(creaEl('span','nota-inline','Totale puntato: ' + totale + ' Galeoni'));
        li.appendChild(testa);

        for(var s=0;s<pg.scommesse.length;s++){
          (function(indiceScommessa){
            var sc=pg.scommesse[indiceScommessa];
            var riga=creaEl('div','riga');
            riga.style.marginTop='7px';
            riga.style.paddingTop='7px';
            riga.style.borderTop='1px solid #444';
            var testo=creaEl('span',null,'Cavallo ' + sc.cavallo + ' — ' + sc.puntata + ' Galeoni');
            var rimuovi=creaEl('button','btn rimuovi piccolo','Rimuovi scommessa');
            rimuovi.type='button';
            rimuovi.disabled=gara.iniziata;
            aggancia(rimuovi,function(){
              if(gara.iniziata) return;
              pg.scommesse.splice(indiceScommessa,1);
              if(!pg.scommesse.length) scommettitori.splice(indicePg,1);
              renderScommettitori();
            });
            riga.appendChild(testo); riga.appendChild(rimuovi); li.appendChild(riga);
          })(s);
        }
        lista.appendChild(li);
      })(i);
    }
  }

  function bloccaIscrizioni(blocca){
    btnAggiungi.disabled=blocca;
    pannello.querySelector('#cv-nome').disabled=blocca;
    selCavallo.disabled=blocca;
    pannello.querySelector('#cv-puntata').disabled=blocca;
    inputNomiCavalli.disabled=blocca;
    renderScommettitori();
  }

  function avviaGaraSeNecessario(){
    if(gara.iniziata) return true;
    if(!scommettitori.length){
      aggiungiLog(log,'<span class="avviso">Conferma almeno una scommessa prima di avviare il Round 1.</span>');
      return false;
    }
    gara.iniziata=true;
    gara.giocatori=scommettitori.map(function(pg){
      return {
        nome:pg.nome,
        scommesse:pg.scommesse.map(function(sc){ return {cavallo:sc.cavallo,puntata:sc.puntata}; })
      };
    });
    gara.nomiCavalli=leggiNomiCavalli();
    bloccaIscrizioni(true);
    return true;
  }

  function roundDisponibile(numero){
    if(gara.conclusa || gara.roundAttivo) return false;
    if(numero===1) return gara.rounds.length===0 && scommettitori.length>0;
    return gara.rounds.length===numero-1;
  }

  function renderRoundNav(){
    svuota(roundNav);
    for(var r=1;r<=5;r++){
      (function(numero){
        var fatto=gara.rounds.length>=numero;
        var attivo=gara.roundAttivo && gara.roundAttivo.numero===numero;
        var btn=creaEl('button', fatto ? 'btn secondario piccolo' : 'btn piccolo', fatto ? 'Round ' + numero + ' concluso' : (attivo ? 'Round ' + numero + ' in corso' : 'Avvia Round ' + numero));
        btn.type='button';
        btn.disabled=fatto || attivo || !roundDisponibile(numero);
        aggancia(btn,function(){ preparaRound(numero); });
        roundNav.appendChild(btn);
      })(r);
    }
  }

  function renderClassifica(parziale){
    var html='<b>' + (parziale ? 'Classifica dopo il Round ' + gara.rounds.length : 'Classifica finale') + '</b>';
    for(var c=1;c<=7;c++) html+='<br>' + testoHtml(nomeCavallo(c)) + ': ' + gara.punti[c] + ' punti';
    return html;
  }

  function valoreRisultato(){
    if(!gara.roundAttivo) return null;
    var v=parseInt(gara.roundAttivo.risultato,10);
    return Number.isFinite(v) && v>=1 && v<=7 ? v : null;
  }

  function preparaRound(numero){
    if(!roundDisponibile(numero)) return;
    if(!avviaGaraSeNecessario()){ renderRoundNav(); return; }
    gara.roundAttivo={numero:numero, risultato:null};
    renderRoundNav();
    renderRoundArea();
  }

  function renderRoundArea(){
    svuota(roundArea);
    if(gara.conclusa){
      roundArea.appendChild(creaEl('div','successo','I 5 round sono stati completati. La classifica finale è riportata qui sotto.'));
      return;
    }
    if(!gara.roundAttivo){
      var prossimo=gara.rounds.length+1;
      roundArea.appendChild(creaEl('div','nota', prossimo<=5 ? 'Avvia il Round ' + prossimo + ' quando siete pronti a proseguire la role.' : 'Gara completata.'));
      return;
    }

    var ra=gara.roundAttivo;
    var box=creaEl('div','bb-scelta-round');
    var titolo=creaEl('h3',null,'Round ' + ra.numero); titolo.style.marginTop='0'; box.appendChild(titolo);
    box.appendChild(creaEl('div','nota','Copia il dado sul forum, effettua il tiro durante la role e inserisci qui il risultato realmente ottenuto. Il tool non estrae alcun risultato.'));

    var riga=creaEl('div','bb-dado-riga');
    riga.style.marginTop='12px';
    var info=creaEl('div','bb-dado-info');
    info.innerHTML='<span>Vincitore del Round ' + ra.numero + '</span><span class="bb-dado-formula">1d7</span>';
    var cp=creaEl('button','btn secondario piccolo','Copia'); cp.type='button';
    aggancia(cp,function(){ copiaTestoCavalli(codiceDadoCv(ra.numero),cp); });
    var inp=document.createElement('input');
    inp.type='number'; inp.className='bb-dado-risultato'; inp.min='1'; inp.max='7'; inp.step='1'; inp.placeholder='Risultato';
    if(valoreRisultato()!==null) inp.value=String(ra.risultato);
    var stato=creaEl('div','nota','Inserisci il risultato del dado, da 1 a 7.');
    var btnConferma=creaEl('button','btn','Conferma Round ' + ra.numero); btnConferma.type='button'; btnConferma.disabled=valoreRisultato()===null;
    btnConferma.style.marginTop='12px';

    function aggiorna(){
      var v=parseInt(inp.value,10);
      ra.risultato=(Number.isFinite(v) && v>=1 && v<=7) ? v : null;
      if(inp.value!=='' && ra.risultato===null) inp.setCustomValidity('Inserisci un risultato da 1 a 7.'); else inp.setCustomValidity('');
      btnConferma.disabled=valoreRisultato()===null;
      stato.textContent=valoreRisultato()===null ? 'Inserisci il risultato del dado, da 1 a 7.' : nomeCavallo(valoreRisultato()) + ' si aggiudica il round.';
    }
    inp.addEventListener('input',aggiorna);

    riga.appendChild(info); riga.appendChild(cp); riga.appendChild(inp); box.appendChild(riga);
    stato.style.marginTop='12px'; box.appendChild(stato);
    aggancia(btnConferma,confermaRound);
    box.appendChild(btnConferma);
    roundArea.appendChild(box);
  }

  function confermaRound(){
    if(!gara.roundAttivo || valoreRisultato()===null) return;
    var ra=gara.roundAttivo;
    var v=valoreRisultato();
    gara.punti[v]++;
    gara.rounds.push({numero:ra.numero, risultato:v});
    gara.roundAttivo=null;

    aggiungiLog(log,'<b>Round ' + ra.numero + '</b><br>' + testoDado(v) + ' → <b>' + testoHtml(nomeCavallo(v)) + '</b> si aggiudica il round e ottiene 1 punto.<br><br>' + renderClassifica(true));

    if(gara.rounds.length>=5){
      gara.conclusa=true;
      mostraEsitoFinale();
    }
    renderRoundNav();
    renderRoundArea();
  }

  function mostraEsitoFinale(){
    var puntiMax=Math.max.apply(null,gara.punti.slice(1));
    var pari=[];
    for(var c=1;c<=7;c++) if(gara.punti[c]===puntiMax) pari.push(c);

    var numVinc=pari[0];
    var criterioParita='';
    if(pari.length>1){
      for(var r=gara.rounds.length-1;r>=0;r--){
        if(pari.indexOf(gara.rounds[r].risultato)!==-1){
          numVinc=gara.rounds[r].risultato;
          criterioParita='<br><span class="nota-inline">Parità a ' + puntiMax + ' punti tra ' + testoHtml(pari.map(nomeCavallo).join(', ')) + ': vince ' + testoHtml(nomeCavallo(numVinc)) + ' perché, tra i Cavalli a pari punti, è quello che si è aggiudicato il round più recente (Round ' + gara.rounds[r].numero + ').</span>';
          break;
        }
      }
    }

    var finale=renderClassifica(false);
    var righeScommesse='<br><br><b>Riepilogo Galeoni</b>';
    for(var g=0;g<gara.giocatori.length;g++){
      var pg=gara.giocatori[g];
      var variazioneOn=0;
      var dettagli=[];
      for(var s=0;s<pg.scommesse.length;s++){
        var sc=pg.scommesse[s];
        var puntata=Math.max(0,parseInt(sc.puntata,10)||0);
        var haVinto=sc.cavallo===numVinc;
        var variazione=haVinto ? puntata : -puntata;
        variazioneOn+=variazione;
        if(haVinto){
          dettagli.push(testoHtml(nomeCavallo(sc.cavallo)) + ': puntati ' + puntata + ' G → <span class="vincitore">riceve ' + (puntata*2) + ' G (+' + puntata + ' G netti)</span>');
        } else {
          dettagli.push(testoHtml(nomeCavallo(sc.cavallo)) + ': puntati ' + puntata + ' G → <span class="avviso">perde ' + puntata + ' G</span>');
        }
      }
      var variazioneOff=Math.max(-50,Math.min(50,variazioneOn));
      var segnoOn=variazioneOn>0?'+':'';
      var segnoOff=variazioneOff>0?'+':'';
      var saldoTesto='Saldo complessivo: ' + segnoOn + variazioneOn + ' Galeoni ONGame; ' + segnoOff + variazioneOff + ' Galeoni OFFGame';
      var saldoForum=saldoTesto;
      righeScommesse+='<br><br><b>' + testoHtml(pg.nome) + '</b><br>' + dettagli.join('<br>') + '<br><span class="riga cv-saldo-riga" style="margin-top:7px;align-items:center"><b>' + testoHtml(saldoTesto) + '</b><button type="button" class="btn secondario piccolo cv-copia-saldo" data-saldo="' + testoHtml(saldoForum) + '">Copia saldo</button></span>';
      if(variazioneOn!==variazioneOff){
        righeScommesse+=' <span class="nota-inline">(l\'eccedenza di ' + Math.abs(variazioneOn-variazioneOff) + ' Galeoni vale solo ONGame)</span>';
      }
    }
    aggiungiLog(log,'<b>Esito finale della gara</b><br>' + finale + '<br><br><b>Vince: ' + testoHtml(nomeCavallo(numVinc)) + '</b>' + criterioParita + righeScommesse);
    var voceFinale=log.firstElementChild;
    if(voceFinale){
      var bottoniSaldo=voceFinale.querySelectorAll('.cv-copia-saldo');
      for(var b=0;b<bottoniSaldo.length;b++){
        (function(btn){
          aggancia(btn,function(){ copiaTestoCavalli(btn.getAttribute('data-saldo') || '',btn); });
        })(bottoniSaldo[b]);
      }
    }
  }

  aggancia(btnAggiungi,function(){
    if(gara.iniziata) return;
    var nome=pannello.querySelector('#cv-nome').value.trim();
    if(!nome) nome='Giocatore ' + (scommettitori.length+1);
    var cavallo=parseInt(selCavallo.value,10);
    var puntata=leggiIntero(pannello.querySelector('#cv-puntata'),1,1);
    if(puntata<1){aggiungiLog(log,'<span class="avviso">La puntata deve essere di almeno 1 Galeone.</span>');return;}
    var pg=trovaScommettitore(nome);
    if(!pg){
      pg={nome:nome,scommesse:[]};
      scommettitori.push(pg);
    }
    var esistente=null;
    for(var i=0;i<pg.scommesse.length;i++) if(pg.scommesse[i].cavallo===cavallo){ esistente=pg.scommesse[i]; break; }
    if(esistente){
      esistente.puntata=puntata;
      aggiungiLog(log,'<span class="nota-inline">Scommessa di <b>' + testoHtml(pg.nome) + '</b> sul Cavallo ' + cavallo + ' aggiornata a ' + puntata + ' Galeoni.</span>');
    } else {
      pg.scommesse.push({cavallo:cavallo,puntata:puntata});
    }
    pannello.querySelector('#cv-nome').value=pg.nome;
    pannello.querySelector('#cv-puntata').value='1';
    renderScommettitori();
    renderRoundNav();
  });

  aggancia(pannello.querySelector('#cv-nuova'),function(){
    gara=nuovaGara();
    scommettitori=[];
    inputNomiCavalli.value='';
    pannello.querySelector('#cv-nome').value='';
    pannello.querySelector('#cv-puntata').value='1';
    bloccaIscrizioni(false);
    svuota(log);
    renderScommettitori();
    renderRoundNav();
    renderRoundArea();
  });

  renderScommettitori();
  renderRoundNav();
  renderRoundArea();
}

/* ============================================================
   3. DARDI MAGICI
   ============================================================ */

function initDardi(pannello){
  pannello.innerHTML =
    '<h2>Dardi Magici</h2>' +
    '<p class="intro">Inserisci prima tutti i PG che partecipano alla partita. Per ogni Dardo, ciascun PG ha un proprio blocco con i due tiri necessari: il dado per l\'anello, determinato dalla sua Destrezza, e 1d20 per lo spicchio. Usa «Copia tutti i dadi» nel riquadro del singolo PG per copiare insieme soltanto i suoi due dadi, inserisci i risultati ottenuti sul forum e conferma: il tool mostrerà il riepilogo di quel Dardo per tutti i partecipanti, aggiornerà i punteggi complessivi e permetterà di copiarlo subito. Ogni PG ha 5 Dardi a disposizione; il centro pieno assegna 501 punti e conclude immediatamente la partita.</p>' +
    '<div class="riquadro">' +
      '<div class="riga">' +
        '<label>Nome PG <input type="text" id="dg-nome"></label>' +
        '<label>Destrezza <input type="number" id="dg-destrezza" value="10" min="1"></label>' +
        '<button class="btn secondario piccolo" id="dg-aggiungi">Conferma</button>' +
        '<button class="btn secondario piccolo" id="dg-nuova" disabled>Nuova partita</button>' +
      '</div>' +
      '<div id="dg-partecipanti" class="nota"></div>' +
    '</div>' +
    '<p class="nota">Nota regolamentare: il valore 15 compare sia nella fascia 11-15 sia nella fascia 15-20. Finché il testo non viene corretto, il tool applica 1d40 a Destrezza 15 seguendo la prima fascia esplicitamente comprensiva del valore.</p>' +
    '<div id="dg-round"></div>' +
    '<div class="log" id="dg-log"></div>';

  var partecipantiBox=pannello.querySelector('#dg-partecipanti');
  var roundBox=pannello.querySelector('#dg-round');
  var log=pannello.querySelector('#dg-log');
  var bConferma=pannello.querySelector('#dg-aggiungi');
  var bNuovaPartita=pannello.querySelector('#dg-nuova');
  var giocatori=[];
  var dardoCorrente=1;
  var roundPreparato=false;
  var partitaConclusa=false;
  var esitoRegistrato=false;

  function dadoAnello(destrezza){
    if(destrezza<=5){return 50;}
    if(destrezza<=10){return 45;}
    if(destrezza<=15){return 40;}
    if(destrezza<=20){return 35;}
    return 30;
  }
  function interpretaAnello(risultato){
    if(risultato===1){return {nome:'Centro pieno',molt:0,fine:true};}
    if(risultato<=6){return {nome:'Centro',molt:4,fine:false};}
    if(risultato<=14){return {nome:'Anello del doppio',molt:3,fine:false};}
    if(risultato<=29){return {nome:'Anello del triplo',molt:2,fine:false};}
    return {nome:'Vuoto',molt:1,fine:false};
  }
  /* I partecipanti restano modificabili anche dopo "Prepara Dardo 1":
     il roster si blocca solo quando il primo Dardo viene effettivamente confermato. */
  function partitaIniziata(){ return dardoCorrente>1 || partitaConclusa; }
  function aggiornaPulsanti(){
    bConferma.disabled=partitaIniziata();
    bNuovaPartita.disabled=!partitaConclusa;
  }
  function mostraPartecipanti(){
    svuota(partecipantiBox);
    if(!giocatori.length){
      partecipantiBox.textContent='Conferma almeno un PG. Puoi aggiungere altri partecipanti anche dopo aver preparato il Dardo 1, finché non ne confermi i risultati.';
      return;
    }
    partecipantiBox.appendChild(creaEl('div',null,'Partecipanti confermati:'));
    for(var i=0;i<giocatori.length;i++){
      (function(idx){
        var pg=giocatori[idx];
        var r=creaEl('div','riga');
        var t=creaEl('span');
        t.innerHTML='<b>'+testoHtml(pg.nome)+'</b> — Destrezza '+pg.destrezza+' — dado anello 1d'+dadoAnello(pg.destrezza)+' — totale: <span class="esito">'+pg.punteggio+'</span>';
        r.appendChild(t);
        var rem=creaEl('button','btn rimuovi piccolo','Rimuovi');
        rem.disabled=partitaIniziata();
        aggancia(rem,function(){ if(partitaIniziata()){return;} giocatori.splice(idx,1); mostraPartecipanti(); mostraRound(); });
        r.appendChild(rem);
        partecipantiBox.appendChild(r);
      })(i);
    }
  }
  function testoDadiPg(pg,numero){
    var facce=dadoAnello(pg.destrezza);
    return [
      codiceDadoForumGenerico('1d'+facce,'Dardi Magici - '+pg.nome+' - Dardo '+numero+' - Anello'),
      codiceDadoForumGenerico('1d20','Dardi Magici - '+pg.nome+' - Dardo '+numero+' - Spicchio')
    ].join('\n');
  }
  function esitoFinaleTesto(){
    if(!giocatori.length){return '';}
    var massimo=-1,vincitori=[];
    for(var i=0;i<giocatori.length;i++){ if(giocatori[i].punteggio>massimo){massimo=giocatori[i].punteggio;} }
    for(var j=0;j<giocatori.length;j++){ if(giocatori[j].punteggio===massimo){vincitori.push(giocatori[j].nome);} }
    if(vincitori.length===1){return 'Vince '+vincitori[0]+' con '+massimo+' punti!';}
    return 'Parità a '+massimo+' punti tra '+vincitori.join(', ')+'.';
  }
  function registraVincitore(){
    if(esitoRegistrato || !partitaConclusa || !giocatori.length){return;}
    esitoRegistrato=true;
    var testo=esitoFinaleTesto();
    if(testo.indexOf('Vince ')===0){aggiungiLog(log,'<span class="vincitore">'+testoHtml(testo)+'</span>');}
    else{aggiungiLog(log,'<span class="esito">'+testoHtml(testo)+'</span>');}
  }
  function aggiungiRiepilogoDardo(html,testo){
    var voce=creaEl('div','voce');
    var corpo=creaEl('div');
    corpo.innerHTML=html;
    voce.appendChild(corpo);
    var copia=creaEl('button','btn secondario piccolo','Copia riepilogo');
    copia.type='button';
    aggancia(copia,function(){copiaTestoForum(testo,copia);});
    voce.appendChild(copia);
    log.insertBefore(voce,log.firstChild);
  }
  function mostraRound(){
    svuota(roundBox);
    aggiornaPulsanti();
    if(!giocatori.length || partitaConclusa){
      if(partitaConclusa){
        var fine=creaEl('div','riquadro');
        fine.innerHTML='<b>Partita conclusa.</b> Consulta il riepilogo dei Dardi e il risultato finale qui sotto.';
        roundBox.appendChild(fine);
      }
      return;
    }
    var box=creaEl('div','riquadro');
    box.appendChild(creaEl('h3',null,'Dardo '+dardoCorrente+' di 5'));
    if(!roundPreparato){
      box.appendChild(creaEl('div','nota','Prepara il Dardo quando vuoi: puoi ancora aggiungere o rimuovere PG durante il Dardo 1 finché non confermi i risultati. Per ciascun PG verranno mostrati i suoi due dadi da copiare insieme sul forum.'));
      var prepara=creaEl('button','btn','Prepara Dardo '+dardoCorrente);prepara.disabled=!giocatori.length;
      aggancia(prepara,function(){if(!giocatori.length)return;roundPreparato=true; mostraPartecipanti(); mostraRound(); });
      box.appendChild(prepara);
      if(!giocatori.length)box.appendChild(creaEl('div','nota','Conferma almeno un PG prima di preparare e copiare i dadi.'));
      roundBox.appendChild(box);
      return;
    }

    box.appendChild(creaEl('div','nota','Ogni PG ha il proprio pulsante «Copia tutti i dadi»: copia insieme soltanto i suoi due tiri, già etichettati con nome e numero del Dardo. I singoli dadi restano copiabili separatamente.'));

    var inputs=[];
    for(var i=0;i<giocatori.length;i++){
      (function(pg){
        var facce=dadoAnello(pg.destrezza);
        var pgbox=creaEl('div','riquadro');
        var pgTitolo=creaEl('div');
        pgTitolo.innerHTML='<b>'+testoHtml(pg.nome)+'</b> — Destrezza '+pg.destrezza;
        pgbox.appendChild(pgTitolo);
        var copiaPg=creaEl('button','btn secondario','Copia tutti i dadi');
        copiaPg.type='button';
        aggancia(copiaPg,function(){copiaTestoForum(testoDadiPg(pg,dardoCorrente),copiaPg);});
        pgbox.appendChild(copiaPg);
        var r1=rigaDadoForum('1d'+facce,'Dardi Magici - '+pg.nome+' - Dardo '+dardoCorrente+' - Anello','Risultato anello');
        var r2=rigaDadoForum('1d20','Dardi Magici - '+pg.nome+' - Dardo '+dardoCorrente+' - Spicchio','Risultato spicchio');
        /* Il blocco del singolo PG è il flusso principale; ogni dado resta copiabile anche separatamente. */
        pgbox.appendChild(r1.riga); pgbox.appendChild(r2.riga);
        box.appendChild(pgbox);
        inputs.push({pg:pg,anello:r1.input,spicchio:r2.input,facce:facce});
      })(giocatori[i]);
    }

    var msg=creaEl('div','nota');
    var conferma=creaEl('button','btn','Conferma Dardo '+dardoCorrente);
    aggancia(conferma,function(){
      var risultati=[];
      for(var k=0;k<inputs.length;k++){
        var a=leggiRisultatiDadi(inputs[k].anello,1,inputs[k].facce);
        var s=leggiRisultatiDadi(inputs[k].spicchio,1,20);
        if(!a.ok){gmSetMessaggio(msg,inputs[k].pg.nome+': '+a.errore,true);return;}
        if(!s.ok){gmSetMessaggio(msg,inputs[k].pg.nome+': '+s.errore,true);return;}
        risultati.push({pg:inputs[k].pg,facce:inputs[k].facce,tiroAnello:a.valori[0],tiroSpicchio:s.valori[0]});
      }
      var numeroDardo=dardoCorrente;
      var riepilogo='<b>Dardo '+numeroDardo+'</b><br>';
      var riepilogoTesto='Dardo '+numeroDardo+'\n';
      var centroPieno=false;
      for(var q=0;q<risultati.length;q++){
        var rr=risultati[q], info=interpretaAnello(rr.tiroAnello), punti=0;
        if(info.fine){ punti=501; centroPieno=true; }
        else{ punti=rr.tiroSpicchio*info.molt; }
        rr.pg.punteggio+=punti;
        rr.pg.dardiLanciati++;
        riepilogo+='<b>'+testoHtml(rr.pg.nome)+'</b>: 1d'+rr.facce+' = '+testoDado(rr.tiroAnello)+' → '+info.nome;
        riepilogoTesto+=rr.pg.nome+': 1d'+rr.facce+' = '+rr.tiroAnello+' → '+info.nome;
        if(info.fine){
          riepilogo+=' → <span class="successo">+501 punti</span> (lo spicchio '+rr.tiroSpicchio+' non modifica il centro pieno)';
          riepilogoTesto+=' → +501 punti (lo spicchio '+rr.tiroSpicchio+' non modifica il centro pieno)';
        } else {
          riepilogo+='; 1d20 = '+testoDado(rr.tiroSpicchio)+' → <b>'+punti+' punti</b>';
          riepilogoTesto+='; 1d20 = '+rr.tiroSpicchio+' → '+punti+' punti';
        }
        riepilogo+=' — totale: <b>'+rr.pg.punteggio+'</b><br>';
        riepilogoTesto+=' — totale: '+rr.pg.punteggio+'\n';
      }
      roundPreparato=false;
      if(centroPieno || dardoCorrente>=5){
        partitaConclusa=true;
        riepilogoTesto+='\n'+esitoFinaleTesto();
      }
      aggiungiRiepilogoDardo(riepilogo,riepilogoTesto.replace(/\n$/,''));
      if(partitaConclusa){ registraVincitore(); }
      else{ dardoCorrente++; }
      mostraPartecipanti();
      mostraRound();
    });
    box.appendChild(conferma); box.appendChild(msg); roundBox.appendChild(box);
  }

  aggancia(bConferma,function(){
    if(partitaIniziata()){aggiungiLog(log,'<span class="avviso">Il primo Dardo è già stato confermato: da questo momento i partecipanti non possono più cambiare. Usa «Nuova partita» dopo la conclusione per ricominciare.</span>');return;}
    var nome=pannello.querySelector('#dg-nome').value.trim();
    if(!nome){nome='Giocatore '+(giocatori.length+1);}
    for(var i=0;i<giocatori.length;i++){
      if(giocatori[i].nome.toLowerCase()===nome.toLowerCase()){
        aggiungiLog(log,'<span class="avviso">'+testoHtml(nome)+' è già tra i partecipanti.</span>');return;
      }
    }
    var destrezza=leggiIntero(pannello.querySelector('#dg-destrezza'),1,1);
    giocatori.push({nome:nome,destrezza:destrezza,punteggio:0,dardiLanciati:0});
    pannello.querySelector('#dg-nome').value='';
    mostraPartecipanti(); mostraRound();
  });
  aggancia(bNuovaPartita,function(){
    if(bNuovaPartita.disabled){return;}
    giocatori=[];dardoCorrente=1;roundPreparato=false;partitaConclusa=false;esitoRegistrato=false;svuota(log);
    pannello.querySelector('#dg-nome').value='';
    mostraPartecipanti(); mostraRound();
  });

  mostraPartecipanti();
  mostraRound();
}
/* ============================================================
   4. GOBBIGLIE
   ============================================================ */

function initGobbiglie(pannello){
  pannello.innerHTML =
    '<h2>Gobbiglie</h2>' +

    var colEstratto=c.valori[0],runaEstratta=r.valori[0],nomeColore=colEstratto===1?'Viola':'Verde';
    var righe='<b>Estrazione:</b> Colore '+testoDado(colEstratto)+' → '+nomeColore+'   |   Runa '+testoDado(runaEstratta)+' → '+RUNE[runaEstratta-1];
    for(var i=0;i<puntate.length;i++){
      var p=puntate[i],vincita=0,dettagli=[];
      if(p.colore===colEstratto&&p.colore){vincita+=p.puntataColore*2;dettagli.push('colore '+nomeColore+' ('+colEstratto+') indovinato (+'+(p.puntataColore*2)+')');}
      if(p.runa===runaEstratta&&p.runa){vincita+=p.puntataRuna*24;dettagli.push('runa '+RUNE[runaEstratta-1]+' ('+runaEstratta+') indovinata (+'+(p.puntataRuna*24)+')');}
      if(vincita>0){righe+='<br><span class="vincitore">'+testoHtml(p.nome)+' vince '+vincita+' Galeoni</span> — '+dettagli.join(', ');}else{righe+='<br>'+testoHtml(p.nome)+' non vince nulla.';}
    }
    aggiungiLog(log,righe);gmSetMessaggio(esito,'Estrazione registrata.',false);risColore.value='';risRuna.value='';
  });

  aggiornaStatoEstrazione();
}

/* ============================================================
   AVVIO
   ============================================================ */

costruisciInterfaccia();

})();
