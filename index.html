<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Giochi Magici — Pannello Interattivo</title>
<style>
  :root{
    --oro:#bfad03;
    --oro-chiaro:#e6d24a;
    --sfondo:#1b1b1b;
    --pannello:#2a2a2a;
    --pannello2:#333333;
    --testo:#eee;
    --viola:#9b59b6;
    --verde:#2ecc71;
    --blu:#3498db;
    --rosso:#e74c3c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--sfondo);
    color:var(--testo);
    font-family:'Georgia','Cambria',serif;
    line-height:1.5;
  }
  header{
    padding:22px 18px 10px 18px;
    text-align:center;
    border-bottom:2px solid var(--oro);
    background:linear-gradient(180deg,#242018,#1b1b1b);
  }
  header h1{
    margin:0;
    font-family:'Palatino Linotype','Book Antiqua',serif;
    letter-spacing:2px;
    color:var(--oro-chiaro);
    text-shadow:0 0 10px rgba(191,173,3,0.35);
  }
  header p{color:#bbb;font-style:italic;margin:6px 0 0 0;font-size:0.9em;}
  nav{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:center;
    padding:14px 10px;
    background:#161616;
    border-bottom:1px solid #3a3a3a;
    position:sticky;
    top:0;
    z-index:10;
  }
  nav button{
    background:var(--pannello2);
    color:var(--testo);
    border:1px solid #555;
    border-radius:5px;
    padding:8px 12px;
    font-size:0.85em;
    cursor:pointer;
    font-family:inherit;
    transition:background 0.2s, color 0.2s;
  }
  nav button:hover{background:#3f3f3f;}
  nav button.attivo{
    background:var(--oro);
    color:#1b1b1b;
    font-weight:bold;
    border-color:var(--oro-chiaro);
  }
  main{
    max-width:920px;
    margin:0 auto;
    padding:20px 14px 60px 14px;
  }
  section.pannello{
    display:none;
    background:var(--pannello);
    border:1px solid #444;
    border-left:4px solid var(--oro);
    border-radius:6px;
    padding:18px 20px;
    margin-bottom:20px;
  }
  section.pannello.attivo{display:block;}
  section.pannello h2{
    margin-top:0;
    color:var(--oro-chiaro);
    border-bottom:1px solid #444;
    padding-bottom:8px;
  }
  .intro{color:#ccc;font-size:0.92em;margin-bottom:14px;}
  .riquadro{
    background:var(--pannello2);
    border:1px solid #4a4a4a;
    border-radius:5px;
    padding:12px 14px;
    margin-bottom:14px;
  }
  .riga{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    margin-bottom:8px;
  }
  label{font-size:0.85em;color:#ccc;}
  input[type=text], input[type=password], input[type=number], select{
    background:#1f1f1f;
    color:var(--testo);
    border:1px solid #555;
    border-radius:4px;
    padding:6px 8px;
    font-family:inherit;
    width:120px;
  }
  input[type=text]{width:150px;}
  .btn{
    background:var(--oro);
    color:#1b1b1b;
    border:none;
    border-radius:4px;
    padding:9px 16px;
    font-weight:bold;
    cursor:pointer;
    font-family:inherit;
    font-size:0.9em;
  }
  .btn:hover{background:var(--oro-chiaro);}
  .btn.secondario{
    background:#555;
    color:var(--testo);
  }
  .btn.secondario:hover{background:#666;}
  .btn.piccolo{padding:5px 10px;font-size:0.8em;}
  .btn.rimuovi{background:var(--rosso);color:#fff;}
  ul.giocatori{list-style:none;padding:0;margin:8px 0;}
  ul.giocatori li{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#242424;
    border:1px solid #444;
    border-radius:4px;
    padding:6px 10px;
    margin-bottom:5px;
    font-size:0.9em;
  }
  .log{
    max-height:340px;
    overflow-y:auto;
    background:#161616;
    border:1px solid #444;
    border-radius:5px;
    padding:10px 12px;
    margin-top:10px;
  }
  .log .voce{
    border-bottom:1px dashed #3a3a3a;
    padding:6px 0;
    font-size:0.88em;
  }
  .log .voce:last-child{border-bottom:none;}
  .log .voce .esito{color:var(--oro-chiaro);font-weight:bold;}
  .log .voce .vincitore{color:var(--verde);font-weight:bold;}
  .dado{
    display:inline-block;
    background:#111;
    border:1px solid var(--oro);
    color:var(--oro-chiaro);
    border-radius:4px;
    padding:2px 7px;
    margin:0 3px;
    font-weight:bold;
  }
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:0.88em;}
  table th, table td{border:1px solid #444;padding:6px 8px;text-align:center;}
  table th{background:#222;color:var(--oro-chiaro);}
  .tag-viola{color:var(--viola);}
  .tag-verde{color:var(--verde);}
  .tag-blu{color:var(--blu);}
  .tag-rosso{color:var(--rosso);}
  .nota{
    font-size:0.82em;
    color:#999;
    font-style:italic;
    margin-top:8px;
  }
  .carta{
    display:inline-block;
    background:#1f1f1f;
    border:1px solid #666;
    border-radius:4px;
    padding:5px 9px;
    margin:3px;
    font-size:0.85em;
  }
  .mano{margin:8px 0;}
  .avviso{color:var(--rosso);font-weight:bold;}
  .successo{color:var(--verde);font-weight:bold;}
  footer{
    text-align:center;
    color:#666;
    font-size:0.78em;
    padding:14px;
  }
</style>
</head>

<header>
  <h1>✦ Giochi Magici ✦</h1>
  <p>Pannello interattivo per Locande, Hogwarts e dintorni</p>
</header>

<nav id="barra-nav"></nav>

<main id="area-giochi"></main>

<footer>Strumento generato per uso interno al gioco di ruolo — tira, gioca e divertiti comodamente da qui.</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
  import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-functions.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCvd56bSEL02s2OY2PSk7uyFX-CYRB4Vz0",
    authDomain: "conteggi-eee1b.firebaseapp.com",
    projectId: "conteggi-eee1b",
    storageBucket: "conteggi-eee1b.firebasestorage.app",
    messagingSenderId: "481320219586",
    appId: "1:481320219586:web:87e974d618a302adfadc5b"
  };

  /* App Firebase nominata: non interferisce con l'accesso Email/Password
     del tool Narratore anche se le due pagine sono aperte sullo stesso dominio. */
  const gmApp = initializeApp(firebaseConfig, "giochi-magici");
  const gmAuth = getAuth(gmApp);
  const gmFunctions = getFunctions(gmApp, "europe-west1");

  let authPromise = null;
  function ensureAnonymous(){
    if(gmAuth.currentUser){ return Promise.resolve(gmAuth.currentUser); }
    if(!authPromise){
      authPromise = signInAnonymously(gmAuth).then(c => c.user).finally(() => { authPromise = null; });
    }
    return authPromise;
  }

  window.gmApi = {
    ready: new Promise((resolve, reject) => {
      let resolved = false;
      const unsubscribe = onAuthStateChanged(gmAuth, user => {
        if(resolved) return;
        resolved = true;
        unsubscribe();
        (user ? Promise.resolve(user) : ensureAnonymous()).then(resolve).catch(reject);
      }, reject);
    }),
    call: async function(name, data){
      await ensureAnonymous();
      const fn = httpsCallable(gmFunctions, name);
      const res = await fn(data || {});
      return res.data;
    }
  };
</script>

<script>
(function(){

/* ============================================================
   UTILITA' GENERALI
   ============================================================ */

function tira(facce){
  facce = Number(facce);
  if(!Number.isFinite(facce) || Math.floor(facce) !== facce || facce < 1){ facce = 1; }
  return Math.floor(Math.random() * facce) + 1;
}

function leggiIntero(input, fallback, minimo, massimo){
  var raw = input ? String(input.value).trim() : '';
  if(!/^-?\d+$/.test(raw)){
    if(input){ input.value = String(fallback); }
    return fallback;
  }
  var n = Number(raw);
  if(!Number.isSafeInteger(n)){ n = fallback; }
  if(minimo !== undefined && n < minimo){ n = minimo; }
  if(massimo !== undefined && n > massimo){ n = massimo; }
  if(input){ input.value = String(n); }
  return n;
}

function testoHtml(valore){
  return String(valore === undefined || valore === null ? '' : valore)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function creaEl(tag, classi, testo){
  var e = document.createElement(tag);
  if(classi){ e.className = classi; }
  if(testo !== undefined){ e.textContent = testo; }
  return e;
}

function aggancia(elemento, gestore){
  var nomeEvento = 'cli' + 'ck';
  elemento.addEventListener(nomeEvento, gestore);
}

function aggiungiLog(contenitore, html){
  var voce = creaEl('div', 'voce');
  voce.innerHTML = html;
  contenitore.insertBefore(voce, contenitore.firstChild);
}

function svuota(elemento){
  while(elemento.firstChild){
    elemento.removeChild(elemento.firstChild);
  }
}

function testoDado(valore){
  return '<span class="dado">' + valore + '</span>';
}

function gmChiama(nome, dati){
  if(!window.gmApi || !window.gmApi.call){
    return Promise.reject(new Error('Firebase dei Giochi Magici non è ancora pronto.'));
  }
  return window.gmApi.call(nome, dati || {});
}

function gmErroreTesto(err){
  var msg = err && err.message ? String(err.message) : 'Operazione non riuscita.';
  msg = msg.replace(/^FirebaseError:\s*/i,'').replace(/^\[functions\/[\w-]+\]\s*/i,'');
  return msg;
}

function gmSetMessaggio(el, testo, errore){
  if(!el){ return; }
  el.className = errore ? 'avviso' : 'nota';
  el.textContent = testo || '';
}

function gmCampoPassword(id, placeholder){
  var input = creaEl('input');
  input.type = 'password';
  input.id = id;
  input.placeholder = placeholder || 'Parola d\'ordine della partita';
  input.autocomplete = 'current-password';
  return input;
}

function gmSelectPartecipante(select, players){
  svuota(select);
  for(var i=0;i<players.length;i++){
    var opt = document.createElement('option');
    opt.value = players[i].id;
    opt.textContent = players[i].name + (players[i].claimed ? ' — accesso già impostato' : ' — primo accesso');
    select.appendChild(opt);
  }
}

function gmCartaTesto(c){
  if(!c){ return ''; }
  return c.name || ((c.number || '') + (c.color ? ' ' + c.color : ''));
}


/* Gestione elenco giocatori generico: nome + campi extra opzionali */
function creaGestoreGiocatori(contenitoreLista, campiExtra){
  var elenco = [];
  function render(){
    svuota(contenitoreLista);
    for(var i=0;i<elenco.length;i++){
      (function(idx){
        var g = elenco[idx];
        var li = creaEl('li');
        var testo = g.nome;
        if(campiExtra){
          for(var c=0;c<campiExtra.length;c++){
            var chiave = campiExtra[c].chiave;
            var etichetta = campiExtra[c].etichetta;
            testo = testo + ' — ' + etichetta + ': ' + g[chiave];
          }
        }
        var spanTesto = creaEl('span', null, testo);
        var bRimuovi = creaEl('button', 'btn rimuovi piccolo', 'Rimuovi');
        aggancia(bRimuovi, function(){
          elenco.splice(idx,1);
          render();
        });
        li.appendChild(spanTesto);
        li.appendChild(bRimuovi);
        contenitoreLista.appendChild(li);
      })(i);
    }
  }
  return {
    aggiungi: function(g){ elenco.push(g); render(); },
    lista: function(){ return elenco; },
    svuota: function(){ elenco = []; render(); },
    render: render
  };
}

/* ============================================================
   MAZZO STANDARD DA 52 (Bacchette, Pozioni, Pugnali, Galeoni)
   usato da Jackblack e Knocker
   ============================================================ */

var SEMI_52 = ['Bacchette','Pozioni','Pugnali','Galeoni'];
var NOMI_VALORE_52 = {1:'Specchio',11:'Ministro',12:'Regina',13:'Re'};

function nomeCarta52(valore, seme){
  var n = NOMI_VALORE_52[valore] ? NOMI_VALORE_52[valore] : String(valore);
  return n + ' di ' + seme;
}

function nuovoMazzo52(){
  var mazzo = [];
  for(var s=0;s<SEMI_52.length;s++){
    for(var v=1;v<=13;v++){
      mazzo.push({ valore:v, seme:SEMI_52[s], nome:nomeCarta52(v,SEMI_52[s]) });
    }
  }
  return mazzo;
}

function mescolaMazzo(mazzo){
  var m = mazzo.slice();
  for(var i=m.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp = m[i];
    m[i] = m[j];
    m[j] = tmp;
  }
  return m;
}

function valoreJackblack(carta){
  if(carta.valore === 1){ return 11; }
  if(carta.valore >= 11){ return 10; }
  return carta.valore;
}

/* ============================================================
   REGISTRO SEZIONI
   ============================================================ */

var SEZIONI = [
  { id:'burrobirra', nome:'Burrobirra-Pong', init:initBurrobirra },
  { id:'cavalli', nome:'Corse Cavalli Alati', init:initCavalli },
  { id:'dardi', nome:'Dardi Magici', init:initDardi },
  { id:'gobbiglie', nome:'Gobbiglie', init:initGobbiglie },
  { id:'jackblack', nome:'Jackblack', init:initJackblack },
  { id:'knocker', nome:'Knocker', init:initKnocker },
  { id:'slot', nome:'Slot Broomstick', init:initSlot },
  { id:'sparaschiocco', nome:'Sparaschiocco', init:initSparaschiocco },
  { id:'trionfo', nome:'Trionfo', init:initTrionfo },
  { id:'scacchi', nome:'Scacchi dei Maghi', init:initScacchi },
  { id:'runette', nome:'Runette', init:initRunette }
];

function costruisciInterfaccia(){
  var nav = document.getElementById('barra-nav');
  var area = document.getElementById('area-giochi');

  for(var i=0;i<SEZIONI.length;i++){
    (function(sez){
      var bottone = creaEl('button', null, sez.nome);
      bottone.dataset.target = sez.id;
      aggancia(bottone, function(){ mostraSezione(sez.id); });
      nav.appendChild(bottone);

      var pannello = creaEl('section', 'pannello');
      pannello.id = 'sez-' + sez.id;
      area.appendChild(pannello);

      sez.init(pannello);
    })(SEZIONI[i]);
  }

  mostraSezione(SEZIONI[0].id);
}

function mostraSezione(id){
  for(var i=0;i<SEZIONI.length;i++){
    var pan = document.getElementById('sez-' + SEZIONI[i].id);
    var btn = document.querySelector('nav button[data-target="' + SEZIONI[i].id + '"]');
    if(SEZIONI[i].id === id){
      pan.className = 'pannello attivo';
      btn.className = 'attivo';
    } else {
      pan.className = 'pannello';
      btn.className = '';
    }
  }
}

/* ============================================================
   1. BURROBIRRA-PONG
   ============================================================ */

function initBurrobirra(pannello){
  pannello.innerHTML =
    '<h2>Burrobirra-Pong</h2>' +
    '<p class="intro">Due squadre si sfidano: ad ogni round entrambe lanciano 1dDestrezza (il valore piu alto vince il round). Chi vince almeno 2 round su 3 si aggiudica la partita.</p>' +
    '<div class="riquadro">' +
      '<div class="riga">' +
        '<label>Squadra A — nome <input type="text" id="bb-nomeA" value="Squadra A"></label>' +
        '<label>Destrezza <input type="number" id="bb-destA" value="10" min="1"></label>' +
      '</div>' +
      '<div class="riga">' +
        '<label>Squadra B — nome <input type="text" id="bb-nomeB" value="Squadra B"></label>' +
        '<label>Destrezza <input type="number" id="bb-destB" value="10" min="1"></label>' +
      '</div>' +
      '<button class="btn" id="bb-gioca">Gioca la partita (3 round)</button>' +
    '</div>' +
    '<div class="log" id="bb-log"></div>' +
    '<p class="nota">Ogni centro subito costringe un giocatore della squadra colpita a bere un calice: -1 Resistenza per i post successivi a quelli in cui si beve, pari al numero di calici ingeriti (calcolo da applicare manualmente in role).</p>';

  var log = pannello.querySelector('#bb-log');
  var bottone = pannello.querySelector('#bb-gioca');

  aggancia(bottone, function(){
    var nomeA = testoHtml(pannello.querySelector('#bb-nomeA').value || 'Squadra A');
    var nomeB = testoHtml(pannello.querySelector('#bb-nomeB').value || 'Squadra B');
    var destA = leggiIntero(pannello.querySelector('#bb-destA'), 1, 1);
    var destB = leggiIntero(pannello.querySelector('#bb-destB'), 1, 1);

    var vittorieA = 0;
    var vittorieB = 0;
    var righeRound = '';

    for(var r=1; r<=3; r++){
      var tiroA = tira(destA);
      var tiroB = tira(destB);
      var vincitoreRound = '';
      if(tiroA > tiroB){
        vittorieA++;
        vincitoreRound = nomeA;
      } else {
        if(tiroB > tiroA){
          vittorieB++;
          vincitoreRound = nomeB;
        } else {
          vincitoreRound = 'pareggio (nessun centro)';
        }
      }
      righeRound = righeRound + '<br>Round ' + r + ': ' + nomeA + ' ' + testoDado(tiroA) + ' vs ' + nomeB + ' ' + testoDado(tiroB) + ' — vince <b>' + vincitoreRound + '</b>';
    }

    var esitoFinale = '';
    if(vittorieA > vittorieB){
      esitoFinale = '<span class="vincitore">' + nomeA + ' vince la partita (' + vittorieA + '-' + vittorieB + ')</span>';
    } else {
      if(vittorieB > vittorieA){
        esitoFinale = '<span class="vincitore">' + nomeB + ' vince la partita (' + vittorieB + '-' + vittorieA + ')</span>';
      } else {
        esitoFinale = '<span class="esito">Partita in perfetta parita, si consiglia uno spareggio</span>';
      }
    }

    aggiungiLog(log, '<b>' + nomeA + '</b> vs <b>' + nomeB + '</b>' + righeRound + '<br>' + esitoFinale);
  });
}

/* ============================================================
   2. CORSE DEI CAVALLI ALATI
   ============================================================ */

function initCavalli(pannello){
  pannello.innerHTML =
    '<h2>Corse dei Cavalli Alati</h2>' +
    '<p class="intro">7 Cavalli Alati (numerati 1-7). La gara dura 5 giri: ogni PG iscritto lancia 1d7 ad ogni giro, assegnando un punto al Cavallo con quel numero. Al termine vince il Cavallo con piu punti; chi ha scommesso su di lui vince la posta.</p>' +
    '<div class="riquadro">' +
      '<div class="riga">' +
        '<label>Nome PG <input type="text" id="cv-nome"></label>' +
        '<label>Scommette sul Cavallo <select id="cv-cavallo"></select></label>' +
        '<label>Puntata (Galeoni) <input type="number" id="cv-puntata" value="0" min="0"></label>' +
        '<button class="btn secondario piccolo" id="cv-aggiungi">Aggiungi giocatore</button>' +
      '</div>' +
    '</div>' +
    '<ul class="giocatori" id="cv-lista"></ul>' +
    '<div class="riga">' +
      '<label>Nomi dei Cavalli (facoltativo, separati da virgola, in ordine 1-7) <input type="text" id="cv-nomi-cavalli" style="width:340px"></label>' +
    '</div>' +
    '<button class="btn" id="cv-avvia">Avvia la gara (5 giri)</button>' +
    '<div class="log" id="cv-log"></div>';

  var selCavallo = pannello.querySelector('#cv-cavallo');
  for(var n=1;n<=7;n++){
    var opt = creaEl('option', null, 'Cavallo ' + n);
    opt.value = n;
    selCavallo.appendChild(opt);
  }

  var lista = pannello.querySelector('#cv-lista');
  var gestore = creaGestoreGiocatori(lista, [
    { chiave:'cavallo', etichetta:'Cavallo' },
    { chiave:'puntata', etichetta:'Puntata' }
  ]);

  aggancia(pannello.querySelector('#cv-aggiungi'), function(){
    var nome = pannello.querySelector('#cv-nome').value.trim();
    if(!nome){ nome = 'Giocatore ' + (gestore.lista().length + 1); }
    var cavallo = parseInt(selCavallo.value, 10);
    var puntata = leggiIntero(pannello.querySelector('#cv-puntata'), 0, 0);
    gestore.aggiungi({ nome:nome, cavallo:cavallo, puntata:puntata });
    pannello.querySelector('#cv-nome').value = '';
  });

  var log = pannello.querySelector('#cv-log');

  aggancia(pannello.querySelector('#cv-avvia'), function(){
    var giocatori = gestore.lista();
    if(giocatori.length === 0){
      aggiungiLog(log, '<span class="avviso">Aggiungi almeno un giocatore prima di avviare la gara.</span>');
      return;
    }
    var nomiInput = pannello.querySelector('#cv-nomi-cavalli').value.trim();
    var nomiCavalli = [];
    if(nomiInput){
      nomiCavalli = nomiInput.split(',');
    }
    function nomeCavallo(numero){
      var idx = numero - 1;
      if(nomiCavalli[idx]){ return testoHtml(nomiCavalli[idx].trim()) + ' (Cavallo ' + numero + ')'; }
      return 'Cavallo ' + numero;
    }

    var punti = [0,0,0,0,0,0,0,0];
    var dettaglioGiri = '';
    for(var giro=1; giro<=5; giro++){
      var tiriGiro = [];
      for(var g=0; g<giocatori.length; g++){
        var esito = tira(7);
        punti[esito]++;
        tiriGiro.push(testoHtml(giocatori[g].nome) + '→' + testoDado(esito));
      }
      dettaglioGiri = dettaglioGiri + '<br>Giro ' + giro + ': ' + tiriGiro.join(' | ');
    }

    var puntiMax = -1;
    for(var c=1;c<=7;c++){
      if(punti[c] > puntiMax){ puntiMax = punti[c]; }
    }
    var vincitori = [];
    for(var c2=1;c2<=7;c2++){
      if(punti[c2] === puntiMax){ vincitori.push(c2); }
    }

    var righeClassifica = '';
    for(var c3=1;c3<=7;c3++){
      righeClassifica = righeClassifica + '<br>' + nomeCavallo(c3) + ': ' + punti[c3] + ' punti';
    }

    var righeVincite = '';
    var testoVincitori = '';
    for(var vv=0; vv<vincitori.length; vv++){
      if(vv>0){ testoVincitori = testoVincitori + ', '; }
      testoVincitori = testoVincitori + nomeCavallo(vincitori[vv]);
    }

    if(vincitori.length === 1){
      var numVinc = vincitori[0];
      for(var gg=0; gg<giocatori.length; gg++){
        if(giocatori[gg].cavallo === numVinc){
          righeVincite = righeVincite + '<br><span class="vincitore">' + testoHtml(giocatori[gg].nome) + ' vince ' + giocatori[gg].puntata + ' Galeoni</span> (scommessa su ' + nomeCavallo(numVinc) + ')';
        }
      }
      if(!righeVincite){ righeVincite = '<br>Nessuno dei presenti aveva scommesso sul Cavallo vincitore.'; }
      aggiungiLog(log, '<b>Esito gara</b>' + dettaglioGiri + '<br><br><b>Classifica finale</b>' + righeClassifica + '<br><br><b>Vince: ' + testoVincitori + '</b>' + righeVincite);
    } else {
      aggiungiLog(log, '<b>Esito gara</b>' + dettaglioGiri + '<br><br><b>Classifica finale</b>' + righeClassifica + '<br><br><span class="esito"><b>Parita al primo posto:</b> ' + testoVincitori + '. Il regolamento qui riportato non stabilisce che tutti i Cavalli a pari punti vincano: risolvi la parita prima di assegnare le vincite delle scommesse.</span>');
    }
  });
}

/* ============================================================
   3. DARDI MAGICI
   ============================================================ */

function initDardi(pannello){
  pannello.innerHTML =
    '<h2>Dardi Magici</h2>' +
    '<p class="intro">Ogni Dardo richiede due tiri: uno per l\'anello (in base alla Destrezza) e uno per lo spicchio (1d20). Ogni PG ha 5 Dardi a disposizione; se un Dardo centra il centro pieno la partita finisce subito (501 punti).</p>' +
    '<div class="riquadro">' +
      '<div class="riga">' +
        '<label>Nome PG <input type="text" id="dg-nome"></label>' +
        '<label>Destrezza <input type="number" id="dg-destrezza" value="10" min="1"></label>' +
        '<button class="btn secondario piccolo" id="dg-aggiungi">Aggiungi giocatore</button>' +
        '<button class="btn secondario piccolo" id="dg-nuova" disabled>Nuova partita</button>' +
      '</div>' +
    '</div>' +
    '<div id="dg-giocatori"></div>' +
    '<div class="log" id="dg-log"></div>';

  var contenitoreGiocatori = pannello.querySelector('#dg-giocatori');
  var log = pannello.querySelector('#dg-log');
  var bAggiungiDardi = pannello.querySelector('#dg-aggiungi');
  var bNuovaPartita = pannello.querySelector('#dg-nuova');
  var giocatori = [];
  var partitaConclusa = false;
  var esitoRegistrato = false;

  function partitaDardiIniziata(){
    if(partitaConclusa){ return true; }
    for(var i=0;i<giocatori.length;i++){
      if(giocatori[i].dardiLanciati > 0){ return true; }
    }
    return false;
  }

  function aggiornaResetDardi(){
    var iniziata = partitaDardiIniziata();
    bAggiungiDardi.disabled = iniziata;
    bNuovaPartita.disabled = !partitaConclusa || (giocatori.length > 1 && !esitoRegistrato);
  }

  function dadoAnello(destrezza){
    if(destrezza <= 5){ return 50; }
    if(destrezza <= 10){ return 45; }
    if(destrezza <= 15){ return 40; }
    if(destrezza <= 20){ return 35; }
    return 30;
  }

  function interpretaAnello(risultato){
    if(risultato === 1){ return { nome:'Centro pieno', molt:0, fine:true }; }
    if(risultato <= 6){ return { nome:'Centro', molt:4, fine:false }; }
    if(risultato <= 14){ return { nome:'Anello del doppio', molt:3, fine:false }; }
    if(risultato <= 29){ return { nome:'Anello del triplo', molt:2, fine:false }; }
    return { nome:'Vuoto', molt:1, fine:false };
  }

  function tuttiHannoFinito(){
    if(giocatori.length === 0){ return false; }
    for(var i=0;i<giocatori.length;i++){
      if(giocatori[i].dardiLanciati < 5 && !giocatori[i].finito){ return false; }
    }
    return true;
  }

  function ricalcolaConclusione(){
    partitaConclusa = false;
    for(var i=0;i<giocatori.length;i++){
      if(giocatori[i].finito){ partitaConclusa = true; break; }
    }
    if(!partitaConclusa && tuttiHannoFinito()){ partitaConclusa = true; }
    if(!partitaConclusa){ esitoRegistrato = false; }
  }

  function disegnaGiocatori(){
    svuota(contenitoreGiocatori);
    for(var i=0;i<giocatori.length;i++){
      (function(idx){
        var pg = giocatori[idx];
        var box = creaEl('div', 'riquadro');

        var titolo = creaEl('div');
        titolo.innerHTML = '<b>' + testoHtml(pg.nome) + '</b> — Destrezza ' + pg.destrezza + ' (usa 1d' + dadoAnello(pg.destrezza) + ' per l\'anello) — Punteggio totale: <span class="esito">' + pg.punteggio + '</span> — Dardi lanciati: ' + pg.dardiLanciati + '/5' + (pg.finito ? ' <span class="successo">(CENTRO PIENO - 501!)</span>' : '');
        box.appendChild(titolo);

        var bLancia = creaEl('button', 'btn piccolo', 'Lancia un Dardo');
        if(partitaConclusa || pg.dardiLanciati >= 5 || pg.finito){
          bLancia.disabled = true;
        }
        aggancia(bLancia, function(){
          if(partitaConclusa){ return; }
          var facceAnello = dadoAnello(pg.destrezza);
          var tiroAnello = tira(facceAnello);
          var info = interpretaAnello(tiroAnello);
          pg.dardiLanciati++;

          var riga = '<b>' + testoHtml(pg.nome) + '</b> — Dardo ' + pg.dardiLanciati + ': 1d' + facceAnello + ' = ' + testoDado(tiroAnello) + ' → ' + info.nome;

          if(info.fine){
            pg.punteggio = 501;
            pg.finito = true;
            partitaConclusa = true;
            riga = riga + ' <span class="successo">CENTRO PIENO! 501 punti: la partita termina immediatamente.</span>';
          } else {
            var tiroSpicchio = tira(20);
            var puntiOttenuti = tiroSpicchio * info.molt;
            pg.punteggio = pg.punteggio + puntiOttenuti;
            riga = riga + ' — spicchio 1d20 = ' + testoDado(tiroSpicchio) + ' → ' + puntiOttenuti + ' punti (spicchio x' + info.molt + ')';
          }

          if(!partitaConclusa && tuttiHannoFinito()){ partitaConclusa = true; }
          aggiungiLog(log, riga);
          disegnaGiocatori();
        });
        box.appendChild(bLancia);

        var bRimuovi = creaEl('button', 'btn rimuovi piccolo', 'Rimuovi giocatore');
        bRimuovi.disabled = partitaDardiIniziata();
        aggancia(bRimuovi, function(){
          if(partitaDardiIniziata()){ return; }
          giocatori.splice(idx,1);
          esitoRegistrato = false;
          ricalcolaConclusione();
          disegnaGiocatori();
        });
        box.appendChild(bRimuovi);

        contenitoreGiocatori.appendChild(box);
      })(i);
    }

    if(!esitoRegistrato && giocatori.length > 1 && (partitaConclusa || tuttiHannoFinito())){
      var bConfronta = creaEl('button', 'btn', 'Confronta punteggi e decreta il vincitore');
      aggancia(bConfronta, function(){
        if(esitoRegistrato){ return; }
        esitoRegistrato = true;
        var massimo = -1;
        for(var i2=0;i2<giocatori.length;i2++){
          if(giocatori[i2].punteggio > massimo){ massimo = giocatori[i2].punteggio; }
        }
        var vincitori = [];
        for(var j=0;j<giocatori.length;j++){
          if(giocatori[j].punteggio === massimo){ vincitori.push(testoHtml(giocatori[j].nome)); }
        }
        if(vincitori.length === 1){
          aggiungiLog(log, '<span class="vincitore">Vince ' + vincitori[0] + ' con ' + massimo + ' punti!</span>');
        } else {
          aggiungiLog(log, '<span class="esito">Parita a ' + massimo + ' punti tra ' + vincitori.join(', ') + '.</span>');
        }
        disegnaGiocatori();
      });
      contenitoreGiocatori.appendChild(bConfronta);
    }
    aggiornaResetDardi();
  }

  aggancia(bNuovaPartita, function(){
    if(bNuovaPartita.disabled){ return; }
    giocatori = [];
    partitaConclusa = false;
    esitoRegistrato = false;
    svuota(log);
    disegnaGiocatori();
  });

  aggancia(bAggiungiDardi, function(){
    if(partitaDardiIniziata()){
      aggiungiLog(log, '<span class="avviso">La partita e gia iniziata: i partecipanti non possono cambiare dopo il primo Dardo. Usa «Nuova partita» dopo la conclusione per ricominciare.</span>');
      return;
    }
    var nome = pannello.querySelector('#dg-nome').value.trim();
    if(!nome){ nome = 'Giocatore ' + (giocatori.length + 1); }
    var destrezza = leggiIntero(pannello.querySelector('#dg-destrezza'), 1, 1);
    giocatori.push({ nome:nome, destrezza:destrezza, punteggio:0, dardiLanciati:0, finito:false });
    pannello.querySelector('#dg-nome').value = '';
    disegnaGiocatori();
  });
}

    '<h2>Gobbiglie</h2>' +
    '<p class="intro">Al primo turno ogni PG lancia 7d9 per piazzare le proprie 7 Gobbiglie sugli anelli. Nei turni successivi si lancia (1-7)d9 per spostare le proprie Gobbiglie, oppure N°Spostate d9 per colpire quelle avversarie (con rischio N°Spostate d3 di retrocedere le proprie). Il punteggio va tenuto manualmente secondo la tabella qui sotto.</p>' +
    '<div class="riquadro">' +
      '<b>Tabella punti (avanzamento)</b>' +

      '<tr><td>4° anello → 3°</td><td>+1</td></tr>' +
      '<tr><td>4° anello → 2°</td><td>+3</td></tr>' +
      '<tr><td>4° anello → 1°</td><td>+7</td></tr>' +

      '<tr><td>3° anello → 1°</td><td>+3</td></tr>' +
      '<tr><td>2° anello → 1°</td><td>+1</td></tr>' +
      '</table>' +
      '<p class="nota">Il ritorno (retrocessione) vale lo stesso importo in negativo. Fuori dagli anelli: nessuna variazione di punti, ma la Gobbiglia esce dalla partita.</p>' +
    '</div>' +

    '<div class="riquadro">' +
      '<h3 style="margin-top:0;color:var(--oro-chiaro)">Primo turno — piazzamento (7d9)</h3>' +
      '<label>Nome PG <input type="text" id="gb-nome1"></label>' +
      '<button class="btn" id="gb-piazza">Lancia 7d9 per il piazzamento</button>' +
      '<div id="gb-esito-piazza"></div>' +
    '</div>' +

    '<div class="riquadro">' +
      '<h3 style="margin-top:0;color:var(--oro-chiaro)">Turni successivi — spostare le proprie Gobbiglie</h3>' +
      '<label>Nome PG <input type="text" id="gb-nome2"></label>' +
      '<label>Quante Gobbiglie sposta (1-7) <input type="number" id="gb-numero2" value="1" min="1" max="7"></label>' +
      '<button class="btn" id="gb-sposta">Lancia (N)d9</button>' +
      '<div id="gb-esito-sposta"></div>' +
    '</div>' +

    '<div class="riquadro">' +
      '<h3 style="margin-top:0;color:var(--oro-chiaro)">Colpire le Gobbiglie avversarie</h3>' +

      '<div id="gb-esito-colpisci"></div>' +
    '</div>' +

    '<div class="log" id="gb-log"></div>';

  var log = pannello.querySelector('#gb-log');

  function posizioneAnello(v){
    if(v <= 2){ return '1° anello'; }
    if(v <= 4){ return '2° anello'; }
    if(v <= 6){ return '3° anello'; }
    if(v <= 8){ return '4° anello'; }
    return 'fuori dagli anelli (eliminata)';
  }

  aggancia(pannello.querySelector('#gb-piazza'), function(){
    var nome = testoHtml(pannello.querySelector('#gb-nome1').value.trim() || 'PG');
    var risultati = [];
    var righe = '';
    for(var i=0;i<7;i++){
      var r = tira(9);
      risultati.push(r);
      righe = righe + testoDado(r) + '→' + posizioneAnello(r) + '  ';

    var messaggio = '<b>' + nome + '</b> — Piazzamento (7d9): <br>' + righe;
    aggiungiLog(log, messaggio);

  aggancia(pannello.querySelector('#gb-sposta'), function(){

    var n = leggiIntero(pannello.querySelector('#gb-numero2'), 1, 1, 7);
    var righe = '';
    for(var i=0;i<n;i++){
      var r = tira(9);

  aggancia(pannello.querySelector('#gb-colpisci'), function(){

    }

    var retrocessioni = 0;
    for(var j=0;j<n;j++){
      var r3 = tira(3);
      righeRischio = righeRischio + testoDado(r3) + '  ';
      if(r3 === 3){ retrocessioni++; }

/* ============================================================
   5. JACKBLACK
   ============================================================ */

function initJackblack(pannello){
  pannello.innerHTML =
    '<h2>Jackblack</h2>' +
    '<p class="intro">Ogni giocatore e il Banco ricevono due carte. A turno ogni giocatore puo chiedere carta o stare, senza superare 21. Vince chi si avvicina di piu a 21 senza sforare.</p>' +
    '<div class="riquadro">' +
      '<div class="riga">' +
        '<label>Nome giocatore <input type="text" id="jb-nome"></label>' +
        '<button class="btn secondario piccolo" id="jb-aggiungi">Aggiungi giocatore</button>' +
        '<button class="btn secondario piccolo" id="jb-nuova-mano">Nuova mano (rimescola tutto)</button>' +
      '</div>' +
    '</div>' +
    '<ul class="giocatori" id="jb-lista-attesa"></ul>' +
    '<div id="jb-tavolo"></div>' +
    '<div class="log" id="jb-log"></div>';

  var log = pannello.querySelector('#jb-log');
  var listaAttesa = pannello.querySelector('#jb-lista-attesa');
  var tavolo = pannello.querySelector('#jb-tavolo');
  var gestoreAttesa = creaGestoreGiocatori(listaAttesa, null);
  var bAggiungiJackblack = pannello.querySelector('#jb-aggiungi');
  var bNuovaManoJackblack = pannello.querySelector('#jb-nuova-mano');

  var mazzo = [];
  var partita = null; /* { banco:{}, giocatori:[...] } */

  function manoJackblackAttiva(){
    return !!(partita && !partita.conclusa);
  }

  function aggiornaConfigurazioneJackblack(){
    var attiva = manoJackblackAttiva();
    bAggiungiJackblack.disabled = attiva;
    bNuovaManoJackblack.disabled = attiva;
    var rimuovi = listaAttesa.querySelectorAll('.rimuovi');
    for(var r=0;r<rimuovi.length;r++){ rimuovi[r].disabled = attiva; }
  }

  aggancia(bAggiungiJackblack, function(){
    if(manoJackblackAttiva()){
      aggiungiLog(log, '<span class="avviso">Concludi prima la mano corrente: i partecipanti non possono cambiare durante la partita.</span>');
      return;
    }
    var nome = pannello.querySelector('#jb-nome').value.trim();
    if(!nome){ return; }
    gestoreAttesa.aggiungi({ nome:nome });
    pannello.querySelector('#jb-nome').value = '';
    aggiornaConfigurazioneJackblack();
  });

  function calcolaTotale(carte){
    var somma = 0;
    for(var i=0;i<carte.length;i++){ somma = somma + valoreJackblack(carte[i]); }
    return somma;
  }

  function renderTavolo(){
    svuota(tavolo);
    if(!partita){ aggiornaConfigurazioneJackblack(); return; }

    var boxBanco = creaEl('div', 'riquadro');
    boxBanco.innerHTML = '<b>Banco</b> — Totale: <span class="esito">' + calcolaTotale(partita.banco.carte) + '</span>';
    var manoBanco = creaEl('div', 'mano');
    for(var b=0;b<partita.banco.carte.length;b++){
      manoBanco.appendChild(creaEl('span', 'carta', partita.banco.carte[b].nome));
    }
    boxBanco.appendChild(manoBanco);
    tavolo.appendChild(boxBanco);

    for(var i=0;i<partita.giocatori.length;i++){
      (function(idx){
        var pg = partita.giocatori[idx];
        var box = creaEl('div', 'riquadro');
        var totale = calcolaTotale(pg.carte);
        var stato = pg.sforato ? '<span class="avviso">sforato</span>' : (pg.fermo ? '<span class="esito">sta</span>' : 'in gioco');
        box.innerHTML = '<b>' + testoHtml(pg.nome) + '</b> — Totale: <span class="esito">' + totale + '</span> — ' + stato;

        var mano = creaEl('div', 'mano');
        for(var c=0;c<pg.carte.length;c++){
          mano.appendChild(creaEl('span', 'carta', pg.carte[c].nome));
        }
        box.appendChild(mano);

        if(!pg.fermo){
          var bCarta = creaEl('button', 'btn piccolo', 'Chiedi carta');
          aggancia(bCarta, function(){
            if(mazzo.length === 0){ aggiungiLog(log, '<span class="avviso">Il mazzo e esaurito.</span>'); return; }
            var carta = mazzo.pop();
            pg.carte.push(carta);
            var nuovoTotale = calcolaTotale(pg.carte);
            aggiungiLog(log, testoHtml(pg.nome) + ' pesca ' + carta.nome + ' — totale: ' + nuovoTotale);
            if(nuovoTotale > 21){
              pg.sforato = true;
              pg.fermo = true;
              aggiungiLog(log, '<span class="avviso">' + testoHtml(pg.nome) + ' sfora 21!</span>');
            }
            renderTavolo();
          });
          box.appendChild(bCarta);

          var bSta = creaEl('button', 'btn secondario piccolo', 'Sta');
          aggancia(bSta, function(){
            pg.fermo = true;
            aggiungiLog(log, testoHtml(pg.nome) + ' sta con ' + calcolaTotale(pg.carte) + '.');
            renderTavolo();
          });
          box.appendChild(bSta);
        }

        tavolo.appendChild(box);
      })(i);
    }

    var bTermina = creaEl('button', 'btn', 'Determina il vincitore');
    var tuttiFermi = true;
    for(var tf=0;tf<partita.giocatori.length;tf++){
      if(!partita.giocatori[tf].fermo){ tuttiFermi = false; }
    }
    bTermina.disabled = !tuttiFermi || !!partita.conclusa;
    aggancia(bTermina, function(){
      if(partita.conclusa){ return; }
      partita.conclusa = true;
      var partecipanti = partita.giocatori.slice();
      partecipanti.push({ nome:'Banco', carte:partita.banco.carte, sforato:calcolaTotale(partita.banco.carte) > 21 });
      var migliorTotale = -1;
      var vincitori = [];
      for(var p=0;p<partecipanti.length;p++){
        var tot = calcolaTotale(partecipanti[p].carte);
        if(tot <= 21){
          if(tot > migliorTotale){
            migliorTotale = tot;
            vincitori = [testoHtml(partecipanti[p].nome)];
          } else if(tot === migliorTotale){
            vincitori.push(testoHtml(partecipanti[p].nome));
          }
        }
      }
      if(vincitori.length === 1){
        aggiungiLog(log, '<span class="vincitore">Vince ' + vincitori[0] + ' con ' + migliorTotale + ' punti!</span>');
      } else if(vincitori.length > 1){
        aggiungiLog(log, '<span class="esito">Parita a ' + migliorTotale + ' punti tra ' + vincitori.join(', ') + '.</span>');
      } else {
        aggiungiLog(log, '<span class="avviso">Tutti hanno sforato 21: nessun vincitore.</span>');
      }
      renderTavolo();
    });
    tavolo.appendChild(bTermina);
    aggiornaConfigurazioneJackblack();
  }

  aggancia(bNuovaManoJackblack, function(){
    if(manoJackblackAttiva()){
      aggiungiLog(log, '<span class="avviso">Concludi prima la mano corrente prima di distribuirne una nuova.</span>');
      return;
    }
    var giocatori = gestoreAttesa.lista();
    if(giocatori.length === 0){
      aggiungiLog(log, '<span class="avviso">Aggiungi almeno un giocatore prima di iniziare.</span>');

      partitaGiocatori.push({ nome:giocatori[i].nome, carte:[mazzo.pop(), mazzo.pop()], fermo:false, sforato:false });

      var probe=creaEl('button','btn secondario','Tiro segreto Volontà vs Acume/Percezione'); var pres=creaEl('div','nota');
      aggancia(probe,function(){probe.disabled=true;gmChiama('knockerProbeBluff',{code:state.code,playerId:state.player.id,targetPlayerId:target.value}).then(function(r){var txt='Tuo tiro 1d'+r.investigatorDie+': '+r.investigatorRoll+' — Volontà avversaria 1d'+r.blufferDie+': '+r.blufferRoll+'. ';if(r.success){txt+=r.bluff?'Riesci a capire che sta bluffando.':'Riesci a capire che non sta bluffando.';}else if(r.tie){txt+='Pareggio: non ottieni informazioni.';}else{txt+='Non riesci a capire se stia bluffando.';}gmSetMessaggio(pres,txt,false);probe.disabled=false;aggiornaPrivato();}).catch(function(e){gmSetMessaggio(pres,gmErroreTesto(e),true);probe.disabled=false;});});

    opt.value = i;
    selSimbolo.appendChild(opt);
  }

  var lista = pannello.querySelector('#sl-lista');
  var gestore = creaGestoreGiocatori(lista, [

    { chiave:'puntata', etichetta:'Puntata' }
  ]);
  var log = pannello.querySelector('#sl-log');

    pannello.querySelector('#sl-nome').value = '';
  });

  aggancia(pannello.querySelector('#sl-gira'), function(){

    var righeVincite = '';

    }
    for(var g=0; g<giocatori.length; g++){
      var pg = giocatori[g];
      var occorrenze = 0;
      for(var e=0;e<estratti.length;e++){
        if(estratti[e] === pg.simbolo){ occorrenze++; }
      }
      var vincita = 0;
      if(occorrenze === 2){ vincita = pg.puntata * 2; }
      if(occorrenze === 3){ vincita = pg.puntata * 5; }
      if(vincita > 0){

      }
    }

    aggiungiLog(log, '<b>Estratti:</b> ' + righeSimboli + righeVincite);
  });
}

function coloreDaNumero(n){
  for(var i=0;i<COLORI_SPARA.length;i++){

function initScacchi(pannello){
  pannello.innerHTML =
    '<h2>Scacchi dei Maghi</h2>' +
    '<p class="intro">Ogni giocatore lancia N°Pezzi dAcume (N deciso a inizio partita). I risultati piu alti confrontati a coppie stabiliscono chi distrugge il pezzo dell\'altro. Dopo 3 post si puo tentare lo scacco matto con 1d10 (successo con 10).</p>' +
    '<div class="riquadro">' +
      '<div class="riga">' +
        '<label>Giocatore A <input type="text" id="sc-nomeA" value="Giocatore A"></label>' +
        '<label>Acume A <input type="number" id="sc-acumeA" value="10" min="1"></label>' +
      '</div>' +
      '<div class="riga">' +
        '<label>Giocatore B <input type="text" id="sc-nomeB" value="Giocatore B"></label>' +
        '<label>Acume B <input type="number" id="sc-acumeB" value="10" min="1"></label>' +
      '</div>' +
      '<div class="riga">' +
        '<label>Pezzi mossi per post <input type="number" id="sc-pezzi" value="4" min="1" max="16"></label>' +
      '</div>' +
      '<button class="btn" id="sc-confronta">Lancia e confronta la mossa</button>' +
      '<div class="nota" id="sc-contatore">Post giocati: 0/3 prima del primo tentativo di scacco matto.</div>' +
    '</div>' +
    '<div class="riquadro">' +
      '<button class="btn secondario" id="sc-matto" disabled>Tenta lo scacco matto (dopo il 3° post, 1d10)</button>' +
      '<button class="btn secondario piccolo" id="sc-nuova" disabled>Nuova partita</button>' +
      '<div id="sc-esito-matto"></div>' +
    '</div>' +
    '<div class="log" id="sc-log"></div>';

  var log = pannello.querySelector('#sc-log');
  var bConfronta = pannello.querySelector('#sc-confronta');
  var bMatto = pannello.querySelector('#sc-matto');
  var bNuovaScacchi = pannello.querySelector('#sc-nuova');
  var campoNomeA = pannello.querySelector('#sc-nomeA');
  var campoNomeB = pannello.querySelector('#sc-nomeB');
  var campoAcumeA = pannello.querySelector('#sc-acumeA');
  var campoAcumeB = pannello.querySelector('#sc-acumeB');
  var campoPezzi = pannello.querySelector('#sc-pezzi');
  var contatore = pannello.querySelector('#sc-contatore');
  var postGiocati = 0;
  var ultimoTentativoPost = 0;
  var conclusa = false;

  function aggiornaControlli(){
    var iniziata = postGiocati > 0 || conclusa;
    contatore.textContent = 'Post giocati: ' + postGiocati + (postGiocati < 3 ? '/3 prima del primo tentativo di scacco matto.' : '.');
    bConfronta.disabled = conclusa;
    campoNomeA.disabled = iniziata;
    campoNomeB.disabled = iniziata;
    campoAcumeA.disabled = iniziata;
    campoAcumeB.disabled = iniziata;
    campoPezzi.disabled = iniziata;
    bMatto.disabled = conclusa || postGiocati < 3 || ultimoTentativoPost === postGiocati;
    bNuovaScacchi.disabled = !conclusa;
  }

  aggancia(bConfronta, function(){
    if(conclusa){ return; }
    var nomeA = testoHtml(pannello.querySelector('#sc-nomeA').value || 'Giocatore A');
    var nomeB = testoHtml(pannello.querySelector('#sc-nomeB').value || 'Giocatore B');
    var acumeA = leggiIntero(pannello.querySelector('#sc-acumeA'), 1, 1);
    var acumeB = leggiIntero(pannello.querySelector('#sc-acumeB'), 1, 1);
    var pezzi = leggiIntero(pannello.querySelector('#sc-pezzi'), 1, 1, 16);

    var tiriA = [];
    var tiriB = [];
    for(var i=0;i<pezzi;i++){
      tiriA.push(tira(acumeA));
      tiriB.push(tira(acumeB));
    }
    tiriA.sort(function(a,b){ return b-a; });
    tiriB.sort(function(a,b){ return b-a; });

    var puntiA = 0;
    var puntiB = 0;
    var righe = '';
    for(var j=0;j<pezzi;j++){
      var esito = '';
      if(tiriA[j] > tiriB[j]){
        puntiA++;
        esito = nomeA + ' distrugge un pezzo';
      } else if(tiriB[j] > tiriA[j]){
        puntiB++;
        esito = nomeB + ' distrugge un pezzo';
      } else if(acumeA > acumeB){
        puntiA++;
        esito = 'parita nel tiro, vince ' + nomeA + ' per Acume superiore';
      } else if(acumeB > acumeA){
        puntiB++;
        esito = 'parita nel tiro, vince ' + nomeB + ' per Acume superiore';
      } else {
        esito = 'parita totale, nessuno distrugge il pezzo';
      }
      righe = righe + '<br>Pezzo ' + (j+1) + ': ' + nomeA + ' ' + testoDado(tiriA[j]) + ' vs ' + nomeB + ' ' + testoDado(tiriB[j]) + ' → ' + esito;
    }

    postGiocati++;
    aggiungiLog(log, '<b>Scontro dei pezzi — post ' + postGiocati + '</b>' + righe + '<br><br>Totale: ' + nomeA + ' distrugge ' + puntiA + ' pezzi, ' + nomeB + ' distrugge ' + puntiB + ' pezzi.');
    aggiornaControlli();
  });

  aggancia(bMatto, function(){
    if(conclusa || postGiocati < 3 || ultimoTentativoPost === postGiocati){ return; }
    ultimoTentativoPost = postGiocati;
    var r = tira(10);
    var esito = pannello.querySelector('#sc-esito-matto');
    if(r === 10){
      conclusa = true;
      esito.innerHTML = testoDado(r) + ' — <span class="successo">SCACCO MATTO!</span>';
      aggiungiLog(log, 'Tentativo di scacco matto: ' + testoDado(r) + ' — <span class="successo">riuscito!</span>');
    } else {
      esito.innerHTML = testoDado(r) + ' — nessuno scacco matto, la partita continua. Per ritentare serve un nuovo post di gioco.';
      aggiungiLog(log, 'Tentativo di scacco matto: ' + testoDado(r) + ' — fallito.');
    }
    aggiornaControlli();
  });


  aggancia(bNuovaScacchi, function(){
    if(!conclusa){ return; }
    postGiocati = 0;
    ultimoTentativoPost = 0;
    conclusa = false;
    pannello.querySelector('#sc-esito-matto').innerHTML = '';
    svuota(log);
    aggiornaControlli();
  });

  aggiornaControlli();
}

var RUNE = [

  var lista = pannello.querySelector('#rn-lista');
  var log = pannello.querySelector('#rn-log');
  var puntate = [];

  function render(){
    svuota(lista);

      (function(idx){

        li.appendChild(span);
        li.appendChild(bRimuovi);
        lista.appendChild(li);
      })(i);
    }
  }

  aggancia(pannello.querySelector('#rn-aggiungi'), function(){
    var nome = pannello.querySelector('#rn-nome').value.trim();
    if(!nome){ return; }
    var punteColore = pannello.querySelector('#rn-puntacolore').checked;
    var punteRuna = pannello.querySelector('#rn-puntaruna').checked;
    var colore = punteColore ? parseInt(pannello.querySelector('#rn-colore').value, 10) : 0;
    var puntataColore = punteColore ? leggiIntero(pannello.querySelector('#rn-puntatacolore'), 0, 0) : 0;
    var runa = punteRuna ? parseInt(selRuna.value, 10) : 0;
    var puntataRuna = punteRuna ? leggiIntero(pannello.querySelector('#rn-puntataruna'), 0, 0) : 0;

    if(!punteColore && !punteRuna){
      aggiungiLog(log, '<span class="avviso">Seleziona almeno una puntata: colore e/o runa.</span>');
      return;
    }
    puntate.push({ nome:nome, colore:colore, puntataColore:puntataColore, runa:runa, puntataRuna:puntataRuna });
    pannello.querySelector('#rn-nome').value = '';
    render();
  });

  aggancia(pannello.querySelector('#rn-gira'), function(){
    var colEstratto = tira(2);
    var runaEstratta = tira(24);
    var nomeColore = colEstratto === 1 ? 'Viola' : 'Verde';

    var righe = '<b>Estrazione:</b> Colore ' + testoDado(colEstratto) + ' → ' + nomeColore + '   |   Runa ' + testoDado(runaEstratta) + ' → ' + RUNE[runaEstratta-1];

    if(puntate.length === 0){
      righe = righe + '<br>(nessuna puntata registrata)';
    }
    for(var i=0;i<puntate.length;i++){
      var p = puntate[i];
      var vincita = 0;
      var dettagli = [];
      if(p.colore === colEstratto){
        if(p.colore){
          vincita = vincita + p.puntataColore * 2;
          dettagli.push('colore indovinato (+' + (p.puntataColore*2) + ')');
        }
      }
      if(p.runa === runaEstratta){
        if(p.runa){
          vincita = vincita + p.puntataRuna * 24;
          dettagli.push('runa indovinata (+' + (p.puntataRuna*24) + ')');
        }
      }
      if(vincita > 0){
        righe = righe + '<br><span class="vincitore">' + testoHtml(p.nome) + ' vince ' + vincita + ' Galeoni</span> — ' + dettagli.join(', ');
      } else {
        righe = righe + '<br>' + testoHtml(p.nome) + ' non vince nulla.';
      }
    }

    aggiungiLog(log, righe);
  });
}

/* ============================================================
   AVVIO
   ============================================================ */

costruisciInterfaccia();

})();
</script>
</body>
